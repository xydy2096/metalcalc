<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OPERARIO</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px}
.card{background:#1e293b;padding:20px;border-radius:10px}
canvas{background:#000;width:100%;max-width:500px}
</style>
</head>

<body>

<h2>Operario</h2>

<div class="card">
<div id="info"></div>
<canvas id="cv" width="500" height="300"></canvas>
<div id="cortes"></div>
</div>

<script>

let p = JSON.parse(localStorage.getItem('mst_sel'));

if(!p){
document.body.innerHTML="No hay trabajo seleccionado";
}

info.innerHTML = `
<b>${p.nombre}</b><br>
${p.tipo} - ${p.cliente}
`;

cortes.innerHTML = p.despiece.map(d=>
`${d.pieza} → ${d.cantidad} x ${d.largo}mm`
).join("<br>");

// DIBUJO
let ctx = cv.getContext("2d");

if(p.tipo==="abatible"){
let W=400,H=200;

ctx.strokeStyle="white";
ctx.strokeRect(50,50,W,H);

// dividir hojas
if(p.datos.n==2){
ctx.beginPath();
ctx.moveTo(50+W/2,50);
ctx.lineTo(50+W/2,50+H);
ctx.stroke();
}
}

if(p.tipo==="corredera"){
ctx.strokeRect(50,100,400,100);
ctx.fillText("Cola",460,150);
}

</script>

</body>
</html>
