<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MSTCALC OPERARIO</title>

<style>
body{
    margin:0;
    background:#020617;
    color:white;
    font-family:sans-serif;
}

.card{
    background:#1e293b;
    margin:15px;
    padding:15px;
    border-radius:10px;
}

canvas{
    width:100%;
    background:black;
    margin-top:10px;
}

h2{padding:15px}
</style>
</head>

<body>

<h2>📋 TRABAJOS EN TALLER</h2>

<div id="lista"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0",
  authDomain: "mstcalc.firebaseapp.com",
  projectId: "mstcalc"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("lista");

onSnapshot(collection(db, "trabajos"), (snapshot)=>{

    lista.innerHTML="";

    snapshot.forEach(doc=>{

        const t = doc.data();

        const div = document.createElement("div");
        div.className="card";

        div.innerHTML = `
        <b>${t.nombre || "Sin nombre"}</b><br>
        ${t.cliente || ""}<br>
        <small>${t.tipo}</small>

        <canvas id="cv-${doc.id}" width="400" height="200"></canvas>

        <div>
        ${t.despiece.map(d=>`
            ${d.pieza} → ${d.cantidad} x ${d.largo.toFixed(0)}mm
        `).join("<br>")}
        </div>

        <button onclick="error('${doc.id}')">⚠️ Error corte</button>
        `;

        lista.appendChild(div);

        // DIBUJO SIMPLE
        const ctx = document.getElementById("cv-"+doc.id).getContext("2d");

        ctx.strokeStyle="white";
        ctx.strokeRect(20,20,300,120);

        if(t.tipo==="abatible" && t.datos.n==2){
            ctx.beginPath();
            ctx.moveTo(170,20);
            ctx.lineTo(170,140);
            ctx.stroke();
        }

    });

});

window.error = function(id){
    alert("Error registrado en pieza: " + id);
};

</script>

</body>
</html>
