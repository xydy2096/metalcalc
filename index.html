<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERARIO - MSTCALC</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 15px; }
        .btn-obra { background: #3b82f6; color: white; padding: 20px; width: 100%; border-radius: 12px; margin-bottom: 10px; font-size: 1.2rem; border: none; }
        .view { display: none; }
        .view.active { display: block; }
        .item-corte { background: #1e293b; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 6px solid #475569; display: flex; justify-content: space-between; align-items: center; }
        .item-corte.hecho { border-left-color: #10b981; opacity: 0.5; }
        .btn-check { background: #10b981; color: white; padding: 10px; border: none; border-radius: 5px; }
        .btn-error { background: #ef4444; color: white; padding: 10px; border: none; border-radius: 5px; margin-top: 5px; }
        .esquema { background: white; border-radius: 8px; margin-bottom: 15px; text-align: center; }
        .esquema img { max-width: 100%; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="v-menu" class="view active">
        <h1>🏗️ TRABAJOS ACTIVOS</h1>
        <div id="lista-obras">Cargando...</div>
    </div>

    <div id="v-detalle" class="view">
        <button onclick="showView('v-menu')" style="background: none; color: #3b82f6; border: none; font-size: 1.1rem;">⬅ Volver</button>
        <h2 id="titulo-obra">Obra</h2>
        <div id="contenido-obra"></div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0", authDomain: "mstcalc.firebaseapp.com", projectId: "mstcalc", storageBucket: "mstcalc.firebasestorage.app", messagingSenderId: "68220801288", appId: "1:68220801288:web:cf0a033e03658c3f579cbd" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // LISTAR OBRAS
    db.collection("materiales").onSnapshot(snap => {
        const container = document.getElementById('lista-obras');
        const obras = new Set();
        snap.forEach(doc => obras.add(doc.data().trabajo));
        container.innerHTML = "";
        obras.forEach(o => {
            const b = document.createElement('button');
            b.className = "btn-obra";
            b.innerText = "OBRA: " + o;
            b.onclick = () => verDetalle(o);
            container.appendChild(b);
        });
    });

    function verDetalle(obraId) {
        showView('v-detalle');
        document.getElementById('titulo-obra').innerText = obraId;
        
        db.collection("materiales").where("trabajo", "==", obraId).onSnapshot(snap => {
            const cont = document.getElementById('contenido-obra');
            cont.innerHTML = "";
            snap.forEach(doc => {
                const d = doc.data();
                if(d.estado === 'info') {
                    cont.innerHTML += `<div class="esquema"><img src="${d.imagen}"></div>`;
                } else {
                    const hecho = d.estado === 'cortado' ? 'hecho' : '';
                    cont.innerHTML += `
                        <div class="item-corte ${hecho}">
                            <div>
                                <b>${d.cantidad}x ${d.nombre}</b><br>
                                <span style="color:#3b82f6; font-size:1.2rem;">${d.medida}</span> | 📐 ${d.angulo || '90°'}
                                <br><button class="btn-error" onclick="errorCorte('${doc.id}')">⚠️ Error Corte</button>
                            </div>
                            <button class="btn-check" onclick="marcar('${doc.id}','${d.estado}')">✅</button>
                        </div>`;
                }
            });
        });
    }

    function marcar(id, est) {
        const nest = est === 'pendiente' ? 'cortado' : 'pendiente';
        db.collection("materiales").doc(id).update({ estado: nest });
    }

    function errorCorte(id) {
        const msg = prompt("¿Cuál es el error? (ej: Medida corta, Rayado...)");
        if(msg) {
            db.collection("alertas").add({ piezaId: id, error: msg, fecha: new Date() });
            alert("Error enviado a administración.");
        }
    }
</script>
</body>
</html>
