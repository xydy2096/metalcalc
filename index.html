<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTCALC PRO</title>

<style>
:root { 
    --p:#0f172a; 
    --s:#3b82f6; 
    --bg:#f1f5f9; 
}

body{margin:0;display:flex;background:var(--bg);font-family:sans-serif}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:var(--p);
    color:white;
    padding:20px;
    height:100vh;
    overflow:auto;
}

.nav-item{
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:5px;
}

.nav-item:hover{background:#1e293b}
.nav-item.active{background:var(--s)}

.category-title{
    padding:10px;
    margin-top:10px;
    background:#1e293b;
    border-radius:8px;
    cursor:pointer;
    font-size:0.8rem;
}

.submenu{display:none;padding-left:10px}
.submenu.open{display:block}

/* MAIN */
.main{flex:1;padding:30px}
.view{display:none}
.view.active{display:block}

.card{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:1fr 480px;
    gap:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
}

button{
    margin-top:10px;
    padding:10px;
    cursor:pointer;
    border:none;
    border-radius:8px;
    background:var(--s);
    color:white;
}

.res{
    background:#111;
    color:#0f0;
    padding:15px;
    border-radius:10px;
    font-family:monospace;
}

canvas{
    width:100%;
    background:#000;
}
</style>
</head>

<body>

<div class="sidebar">

<h2>MSTCALC</h2>

<div class="nav-item active" onclick="showView('v-datos',this)">Proyecto</div>
<div class="nav-item" onclick="showView('v-historial',this)">Historial</div>

<div class="category-title" onclick="toggle('trabajos')">Trabajos</div>
<div id="trabajos" class="submenu open">

<div class="category-title" onclick="toggle('puertas')">Puertas</div>
<div id="puertas" class="submenu open">
<div class="nav-item" onclick="showView('v-abatibles',this)">Abatibles</div>
<div class="nav-item" onclick="showView('v-correderas',this)">Correderas</div>
<div class="nav-item" onclick="showView('v-auto',this)">Autoportantes</div>
</div>

<div class="category-title" onclick="toggle('estructuras')">Estructuras</div>
<div id="estructuras" class="submenu open">
<div class="nav-item" onclick="showView('v-barandillas',this)">Barandillas</div>
<div class="nav-item" onclick="showView('v-vallas',this)">Vallas</div>
</div>

</div>

<div class="category-title" onclick="toggle('stock')">Stock</div>
<div id="stock" class="submenu">
<div class="nav-item" onclick="showView('v-stock',this)">Material</div>
<div class="nav-item" onclick="showView('v-stock-pintura',this)">Pinturas</div>
</div>

<div class="category-title" onclick="toggle('prontuario')">Prontuario</div>
<div id="prontuario" class="submenu">
<div class="nav-item" onclick="showView('v-prontuario',this)">Materiales</div>
<div class="nav-item" onclick="showView('v-prontuario-pintura',this)">Pinturas</div>
</div>

</div>

<div class="main">

<!-- PROYECTO -->
<div id="v-datos" class="view active">
<div class="card">
<h3>Proyecto</h3>
<input id="p-nombre" placeholder="Nombre">
<input id="p-cliente" placeholder="Cliente">
<button onclick="guardarProyecto()">💾 Guardar Proyecto Completo</button>
</div>
</div>

<!-- ABATIBLE -->
<div id="v-abatibles" class="view">
<div class="grid">
<div class="card">
<input id="ab-w" value="3000" oninput="runAb()">
<input id="ab-h" value="2000" oninput="runAb()">
<select id="ab-n" onchange="runAb()">
<option value="1">1</option>
<option value="2">2</option>
</select>
</div>
<div>
<canvas id="cv" width="400" height="300"></canvas>
<div id="ab-res" class="res"></div>
</div>
</div>
</div>

<!-- CORREDERA -->
<div id="v-correderas" class="view">
<div class="card">
<input id="co-w" value="4000" oninput="runCo()">
<input id="co-cola" value="400" oninput="runCo()">
<div id="co-res" class="res"></div>
</div>
</div>

<!-- AUTO -->
<div id="v-auto" class="view">
<div class="card">
<input id="au-w" value="5000" oninput="runAu()">
<div id="au-res" class="res"></div>
</div>
</div>

<!-- BARANDILLA -->
<div id="v-barandillas" class="view">
<div class="card">
<input id="ba-l" value="6000" oninput="runBa()">
<input id="ba-h" value="1000" oninput="runBa()">
<div id="ba-res" class="res"></div>
</div>
</div>

<!-- VALLAS -->
<div id="v-vallas" class="view">
<div class="card">
<input id="va-w" value="2000" oninput="runVa()">
<div id="va-res" class="res"></div>
</div>
</div>

<!-- STOCK -->
<div id="v-stock" class="view"><div class="card">Stock material</div></div>
<div id="v-stock-pintura" class="view"><div class="card">Stock pinturas</div></div>

<!-- PRONTUARIO -->
<div id="v-prontuario" class="view"><div class="card">Materiales</div></div>
<div id="v-prontuario-pintura" class="view"><div class="card">Pinturas</div></div>

<!-- HISTORIAL -->
<div id="v-historial" class="view">
<div class="card">
<h3>Historial</h3>
<div id="historial-lista"></div>
</div>
</div>

</div>

<script>

/* VARIABLES */
let proyectoActual = {
nombre:"",cliente:"",tipo:"",datos:{},despiece:[],fecha:""
};

let historial = JSON.parse(localStorage.getItem("mst_hist")) || [];

/* MENU */
function toggle(id){
document.getElementById(id).classList.toggle('open')
}

function showView(id,el){
document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'))
document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'))
document.getElementById(id).classList.add('active')
if(el) el.classList.add('active')
if(id==="v-historial") renderHistorial()
}

/* PLANO PRO REAL */
function dibujarPlano(W,H,n){
let ctx=document.getElementById("cv").getContext("2d")
ctx.clearRect(0,0,400,300)

let scale=Math.min(300/W,200/H)
let w=W*scale
let h=H*scale

ctx.strokeStyle="white"
ctx.strokeRect(50,40,w,h)

if(n==2){
ctx.beginPath()
ctx.moveTo(50+w/2,40)
ctx.lineTo(50+w/2,40+h)
ctx.stroke()
}

ctx.fillStyle="yellow"
ctx.font="12px monospace"
ctx.fillText(W+" mm",50+w/2-30,30)
ctx.fillText(H+" mm",10,40+h/2)
}

/* CALCULOS */
function runAb(){
let W=+document.getElementById('ab-w').value
let H=+document.getElementById('ab-h').value
let n=+document.getElementById('ab-n').value

let hoja=W/n

let despiece=[
{pieza:"Vertical",cantidad:n*2,largo:H},
{pieza:"Horizontal",cantidad:n*2,largo:hoja}
]

document.getElementById("ab-res").innerHTML=
despiece.map(p=>`${p.pieza} → ${p.cantidad} x ${p.largo.toFixed(0)}mm`).join("<br>")

proyectoActual.tipo="abatible"
proyectoActual.datos={W,H,n}
proyectoActual.despiece=despiece

dibujarPlano(W,H,n)
}

function runCo(){
let W=+document.getElementById('co-w').value
let cola=+document.getElementById('co-cola').value

let despiece=[{pieza:"Larguero",cantidad:2,largo:W+cola}]

document.getElementById("co-res").innerHTML=`Largueros: ${W+cola}mm`

proyectoActual.tipo="corredera"
proyectoActual.datos={W,cola}
proyectoActual.despiece=despiece
}

function runAu(){
let W=+document.getElementById('au-w').value
let cp=W*0.35

let despiece=[
{pieza:"Guía",cantidad:1,largo:W+cp},
{pieza:"Contrapeso",cantidad:1,largo:cp}
]

document.getElementById("au-res").innerHTML=`Contrapeso ${cp}<br>Total ${W+cp}`

proyectoActual.tipo="autoportante"
proyectoActual.datos={W}
proyectoActual.despiece=despiece
}

function runBa(){
let L=+document.getElementById('ba-l').value
let H=+document.getElementById('ba-h').value

let despiece=[
{pieza:"Pasamanos",cantidad:1,largo:L},
{pieza:"Barrote",cantidad:Math.floor(L/120),largo:H-100}
]

document.getElementById("ba-res").innerHTML=`Pasamanos ${L}<br>Barrote ${H-100}`

proyectoActual.tipo="barandilla"
proyectoActual.datos={L,H}
proyectoActual.despiece=despiece
}

function runVa(){
let W=+document.getElementById('va-w').value

let despiece=[{pieza:"Marco",cantidad:1,largo:W}]

document.getElementById("va-res").innerHTML=`Tramo ${W}`

proyectoActual.tipo="valla"
proyectoActual.datos={W}
proyectoActual.despiece=despiece
}

/* GUARDAR */
function guardarProyecto(){
proyectoActual.nombre=document.getElementById("p-nombre").value
proyectoActual.cliente=document.getElementById("p-cliente").value
proyectoActual.fecha=new Date().toLocaleDateString()

historial.push({...proyectoActual})
localStorage.setItem("mst_hist",JSON.stringify(historial))

alert("Proyecto guardado correctamente")
}

/* HISTORIAL */
function renderHistorial(){
let cont=document.getElementById("historial-lista")

cont.innerHTML=historial.map((p,i)=>`
<div style="border-bottom:1px solid #ccc;margin-bottom:10px">
<b>${p.nombre}</b> (${p.tipo})<br>
${p.cliente}<br>
<small>${p.fecha}</small><br>
<button onclick="cargar(${i})">Cargar</button>
</div>
`).join("")
}

function cargar(i){
proyectoActual = historial[i]
alert("Proyecto cargado: "+proyectoActual.nombre)
}

/* INIT */
runAb(); runCo(); runAu(); runBa(); runVa();

</script>

</body>
</html>
