<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OPERARIO</title>

<style>
body{margin:0;background:#020617;color:white;font-family:sans-serif}
.card{background:#1e293b;margin:10px;padding:15px;border-radius:10px}
canvas{width:100%;background:black;margin-top:10px}
</style>
</head>

<body>

<h2 style="padding:10px">TRABAJOS</h2>
<div id="lista"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0",
  authDomain: "mstcalc.firebaseapp.com",
  projectId: "mstcalc"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const lista = document.getElementById("lista");

db.collection("trabajos").onSnapshot(snapshot=>{

    lista.innerHTML="";

    snapshot.forEach(doc=>{

        let t = doc.data();

        let div = document.createElement("div");
        div.className="card";

        div.innerHTML=`
        <b>${t.nombre || "Sin nombre"}</b><br>
        ${t.cliente || ""}<br>
        <small>${t.tipo}</small>

        <canvas id="cv-${doc.id}" width="400" height="200"></canvas>

        <div>
        ${(t.despiece || []).map(d=>`
            ${d.pieza} → ${d.cantidad} x ${d.largo}
        `).join("<br>")}
        </div>
        `;

        lista.appendChild(div);

        // dibujo básico
        let ctx = document.getElementById("cv-"+doc.id).getContext("2d");

        ctx.strokeStyle="white";
        ctx.strokeRect(20,20,300,120);

        if(t.tipo==="abatible" && t.datos && t.datos.n==2){
            ctx.beginPath();
            ctx.moveTo(170,20);
            ctx.lineTo(170,140);
            ctx.stroke();
        }

    });

});

</script>

</body>
</html>
