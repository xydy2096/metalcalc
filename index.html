<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTCALC OPERARIO</title>

<style>
body{margin:0;font-family:sans-serif;background:#0f172a;color:white}

.header{
padding:20px;
background:#020617;
font-size:1.5rem;
}

.container{
padding:20px;
}

.card{
background:#111827;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.pieza{
padding:10px;
margin-bottom:10px;
background:#1e293b;
border-radius:8px;
}

button{
margin-top:5px;
padding:8px;
border:none;
border-radius:6px;
cursor:pointer;
}

.ok{background:#10b981;color:white}
.stock{background:#3b82f6;color:white}
.chatarra{background:#ef4444;color:white}

canvas{
background:#000;
width:100%;
margin-top:20px;
}
</style>
</head>

<body>

<div class="header">👷 OPERARIO - TRABAJOS</div>

<div class="container">

<div id="trabajos"></div>

</div>

<script>

/* FIREBASE */
firebase.initializeApp({
apiKey: "AIza...",
authDomain: "mstcalc.firebaseapp.com",
projectId: "mstcalc"
});

const db = firebase.firestore()

/* CARGAR TRABAJOS */
db.collection("trabajos").onSnapshot(snap => {

let cont = document.getElementById("trabajos")

cont.innerHTML = ""

snap.forEach(doc => {

let t = doc.data()

let html = `
<div class="card">
<h3>${t.nombre || "Sin nombre"}</h3>
<p>${t.tipo}</p>

${t.despiece.map((p,i)=>`
<div class="pieza">
${p.pieza} → ${p.cantidad} x ${p.largo}mm<br>

<button class="ok">✔ Cortado</button>
<button class="stock" onclick="guardarStock('${p.pieza}',${p.largo})">📦 Guardar</button>
<button class="chatarra">🗑 Chatarra</button>
</div>
`).join("")}

<canvas id="cv-${doc.id}" width="400" height="250"></canvas>

</div>
`

cont.innerHTML += html

dibujarPlano(`cv-${doc.id}`, t)

})

})

/* DIBUJO */
function dibujarPlano(id, t){

let c = document.getElementById(id)
if(!c) return

let ctx = c.getContext("2d")

ctx.clearRect(0,0,400,250)

ctx.strokeStyle="white"
ctx.strokeRect(50,50,300,150)

if(t.tipo==="abatible" && t.datos.n==2){
ctx.beginPath()
ctx.moveTo(200,50)
ctx.lineTo(200,200)
ctx.stroke()
}

}

/* STOCK DESDE OPERARIO */
function guardarStock(pieza,largo){

let stock = JSON.parse(localStorage.getItem("mst_stock")) || []

stock.push({
pieza,
largo,
zona:"OPERARIO"
})

localStorage.setItem("mst_stock", JSON.stringify(stock))

alert("Guardado en stock")

}

</script>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</body>
</html>
