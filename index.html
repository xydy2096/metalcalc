<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Operario MSTCALC</title>

<style>
body{font-family:sans-serif;background:#111;color:#0f0;padding:20px}
.card{border:1px solid #333;padding:15px;margin-bottom:10px}
</style>
</head>

<body>

<h2>📡 Trabajos en Taller</h2>

<div id="lista"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TU_API_KEY",
  authDomain: "mstcalc.firebaseapp.com",
  projectId: "mstcalc",
  storageBucket: "mstcalc.firebasestorage.app",
  messagingSenderId: "68220801288",
  appId: "1:68220801288:web:cf0a033e03658c3f579cbd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const lista = document.getElementById("lista");

// 🔥 ESCUCHAR EN TIEMPO REAL
onSnapshot(collection(db, "proyectos"), (snapshot) => {

lista.innerHTML = "";

snapshot.forEach(doc => {

let p = doc.data();

let div = document.createElement("div");
div.className = "card";

div.innerHTML = `
<b>${p.nombre}</b> (${p.tipo})<br>
Cliente: ${p.cliente}<br>
Fecha: ${p.fecha}<br><br>

${p.despiece.map(d =>
`• ${d.pieza} → ${d.cantidad} x ${Math.round(d.largo)}mm`
).join("<br>")}
`;

lista.appendChild(div);

});

});

</script>

</body>
</html>
