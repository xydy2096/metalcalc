<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>OPERARIO</title>
</head>

<body>

<h2>Trabajos</h2>

<div id="lista"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0",
  authDomain: "mstcalc.firebaseapp.com",
  projectId: "mstcalc",
  storageBucket: "mstcalc.firebasestorage.app",
  messagingSenderId: "68220801288",
  appId: "1:68220801288:web:cf0a033e03658c3f579cbd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ESCUCHAR PROYECTOS
onSnapshot(collection(db,"proyectos"), snap => {
  lista.innerHTML = snap.docs.map(doc=>{
    let p = doc.data();
    return `
      <div style="border:1px solid #ccc;margin:10px;padding:10px">
        <b>${p.nombre}</b><br>
        ${p.cliente}<br>
        ${p.tipo}<br>
        ${p.despiece.map(d=>`${d.pieza} ${d.largo}`).join("<br>")}
      </div>
    `;
  }).join("");
});

</script>

</body>
</html>
