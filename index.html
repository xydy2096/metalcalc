<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OPERARIO - MSTCALC V6</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; margin: 0; padding: 10px; }
        .view { display: none; }
        .view.active { display: block; }
        .btn-obra { background: #3b82f6; border: none; padding: 25px; color: white; width: 100%; border-radius: 12px; margin-bottom: 12px; font-size: 1.3rem; font-weight: bold; }
        .card-corte { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 8px; border-left: 6px solid #475569; display: flex; justify-content: space-between; align-items: center; }
        .card-corte.hecho { opacity: 0.2; border-left-color: #10b981; }
        .img-grid { display: flex; overflow-x: auto; gap: 10px; margin-bottom: 20px; background: white; padding: 10px; border-radius: 10px; }
        .img-grid img { height: 260px; border: 1px solid #333; }
        .angulo { background: #f59e0b; color: black; padding: 3px 6px; border-radius: 4px; font-weight: bold; font-size: 0.8rem; }
        .btn-error { background: #ef4444; border: none; padding: 10px; border-radius: 5px; color: white; margin-top: 10px; width: 100%; }
    </style>
</head>
<body>

    <div id="v-menu" class="view active">
        <h1 style="text-align:center">🛠️ LISTA DE TRABAJOS</h1>
        <div id="lista-obras">Cargando...</div>
    </div>

    <div id="v-detalle" class="view">
        <button onclick="location.reload()" style="background:#475569; color:white; border:none; padding:10px; border-radius:5px;">⬅ VOLVER</button>
        <h2 id="nom-obra" style="color: #3b82f6;"></h2>
        <div id="hoja-trabajo"></div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0", authDomain: "mstcalc.firebaseapp.com", projectId: "mstcalc", storageBucket: "mstcalc.firebasestorage.app", messagingSenderId: "68220801288", appId: "1:68220801288:web:cf0a033e03658c3f579cbd" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("materiales").onSnapshot(snap => {
        const menu = document.getElementById('lista-obras');
        const obras = new Set();
        snap.forEach(doc => { if(doc.data().trabajo) obras.add(doc.data().trabajo) });
        menu.innerHTML = "";
        obras.forEach(o => {
            menu.innerHTML += `<button class="btn-obra" onclick="verObra('${o}')">📁 ${o}</button>`;
        });
    });

    function verObra(id) {
        document.getElementById('v-menu').classList.remove('active');
        document.getElementById('v-detalle').classList.add('active');
        document.getElementById('nom-obra').innerText = id;

        db.collection("materiales").where("trabajo", "==", id).orderBy("fecha", "asc").onSnapshot(snap => {
            const cont = document.getElementById('hoja-trabajo');
            let imgsHTML = '<div class="img-grid">';
            let piezasHTML = '';
            
            snap.forEach(doc => {
                const d = doc.data();
                if(d.estado === 'info') imgsHTML += `<img src="${d.imagen}">`;
                else if(d.estado !== 'cortado') {
                    piezasHTML += `
                        <div class="card-corte">
                            <div>
                                <b style="font-size:1.2rem; color:#60a5fa;">${d.cantidad}x ${d.medida}</b><br>
                                <small>${d.nombre}</small><br>
                                <span class="angulo">📐 ${d.angulo}</span><br>
                                <button class="btn-error" onclick="reportarError('${doc.id}', '${d.nombre}')">REPORTAR FALLO</button>
                            </div>
                            <button onclick="completar('${doc.id}')" style="background:#10b981; color:white; border:none; padding:15px; border-radius:10px; font-size:1.2rem;">✅</button>
                        </div>`;
                }
            });
            cont.innerHTML = imgsHTML + '</div>' + piezasHTML;
        });
    }

    function completar(id) { db.collection("materiales").doc(id).update({estado: "cortado"}); }
    
    function reportarError(id, nombre) {
        const msg = prompt("¿Qué ha pasado con " + nombre + "?");
        if(msg) {
            db.collection("alertas").add({ piezaId: id, error: msg, fecha: new Date() });
            alert("Error enviado a administración.");
        }
    }
</script>
</body>
</html>
