<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TALLER - MSTCALC V5</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; padding: 10px; margin:0; }
        .obra-btn { background: #3b82f6; border: none; padding: 20px; color: white; width: 100%; border-radius: 10px; margin-bottom: 10px; font-size: 1.2rem; }
        .card-corte { background: #1e293b; padding: 15px; border-radius: 10px; margin-bottom: 8px; border-left: 6px solid #475569; display: flex; justify-content: space-between; }
        .card-corte.hecho { opacity: 0.3; border-left-color: #10b981; }
        .img-container { background: white; border-radius: 10px; padding: 5px; margin-bottom: 15px; display: flex; overflow-x: auto; gap: 10px; }
        .img-container img { height: 250px; border: 1px solid #ddd; }
        .view { display: none; }
        .view.active { display: block; }
    </style>
</head>
<body>

    <div id="v-menu" class="view active">
        <h2 style="text-align:center">TRABAJOS ACTIVOS</h2>
        <div id="lista-obras"></div>
    </div>

    <div id="v-detalle" class="view">
        <button onclick="location.reload()">⬅ VOLVER</button>
        <h2 id="nom-obra">---</h2>
        <div id="hoja"></div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0", authDomain: "mstcalc.firebaseapp.com", projectId: "mstcalc", storageBucket: "mstcalc.firebasestorage.app", messagingSenderId: "68220801288", appId: "1:68220801288:web:cf0a033e03658c3f579cbd" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    db.collection("materiales").onSnapshot(snap => {
        const menu = document.getElementById('lista-obras');
        const obras = new Set();
        snap.forEach(doc => obras.add(doc.data().trabajo));
        menu.innerHTML = "";
        obras.forEach(o => {
            if(o) menu.innerHTML += `<button class="obra-btn" onclick="verObra('${o}')">📂 ${o}</button>`;
        });
    });

    function verObra(id) {
        document.getElementById('v-menu').classList.remove('active');
        document.getElementById('v-detalle').classList.add('active');
        document.getElementById('nom-obra').innerText = id;

        db.collection("materiales").where("trabajo", "==", id).onSnapshot(snap => {
            const h = document.getElementById('hoja');
            let imgsHTML = '<div class="img-container">';
            let piezasHTML = '';
            
            snap.forEach(doc => {
                const d = doc.data();
                if(d.estado === 'info') imgsHTML += `<img src="${d.imagen}">`;
                else if(d.estado !== 'cortado') {
                    piezasHTML += `
                        <div class="card-corte">
                            <div><b>${d.cantidad}x ${d.medida}</b><br><small>${d.nombre}</small><br>📐 ${d.angulo}</div>
                            <button onclick="cortar('${doc.id}')" style="background:#10b981; color:white; border:none; padding:10px; border-radius:5px;">✅</button>
                        </div>`;
                }
            });
            h.innerHTML = imgsHTML + '</div>' + piezasHTML;
        });
    }

    function cortar(id) {
        db.collection("materiales").doc(id).update({estado: "cortado"});
    }
</script>
</body>
</html>
