<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTCALC OPERARIO</title>

<style>
body{margin:0;display:flex;background:#f1f5f9;font-family:sans-serif}

.sidebar{
width:300px;
background:#0f172a;
color:white;
padding:20px;
height:100vh;
overflow:auto;
}

.item{
padding:10px;
border-bottom:1px solid #334155;
cursor:pointer;
}
.item:hover{background:#1e293b}

.main{flex:1;padding:30px}

.card{
background:white;
padding:20px;
border-radius:12px;
margin-bottom:20px;
}

.res{
background:#111;
color:#0f0;
padding:15px;
font-family:monospace;
border-radius:10px;
}

canvas{
background:#000;
width:100%;
}
</style>
</head>

<body>

<div class="sidebar">
<h2>TRABAJOS</h2>
<div id="lista"></div>
</div>

<div class="main">

<div class="card">
<h3 id="titulo">Selecciona un trabajo</h3>
</div>

<div class="card">
<h3>Despiece</h3>
<div id="despiece" class="res"></div>
</div>

<div class="card">
<h3>Plano</h3>
<canvas id="cv" width="500" height="300"></canvas>
</div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>

firebase.initializeApp({
apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0",
authDomain: "mstcalc.firebaseapp.com",
projectId: "mstcalc"
});

const db = firebase.firestore();

let trabajos = [];

/* ----------- CARGA DATOS ----------- */

// 🔥 Firebase
db.collection("trabajos").get().then(snapshot=>{
trabajos = snapshot.docs.map(doc => doc.data());
renderLista();
});

// 🔁 fallback local
if(trabajos.length === 0){
trabajos = JSON.parse(localStorage.getItem("mst_hist")) || [];
renderLista();
}

/* ----------- LISTA ----------- */

function renderLista(){
const lista = document.getElementById("lista");

if(trabajos.length === 0){
lista.innerHTML = "No hay trabajos";
return;
}

lista.innerHTML = trabajos.map((t,i)=>`
<div class="item" onclick="cargar(${i})">
<b>${t.nombre || "Sin nombre"}</b><br>
<small>${t.tipo}</small>
</div>
`).join("");
}

/* ----------- CARGAR TRABAJO ----------- */

function cargar(i){
const t = trabajos[i];

document.getElementById("titulo").innerText =
`${t.nombre} - ${t.tipo}`;

/* DESPIECE */
document.getElementById("despiece").innerHTML =
(t.despiece || []).map(p =>
`${p.pieza} → ${p.cantidad} x ${p.largo.toFixed(0)}mm`
).join("<br>");

/* PLANO */
dibujar(t);
}

/* ----------- DIBUJO ----------- */

function dibujar(t){
const ctx = document.getElementById("cv").getContext("2d");
ctx.clearRect(0,0,500,300);

ctx.strokeStyle="white";

if(t.tipo==="abatible"){
ctx.strokeRect(100,50,300,200);

if(t.datos.n==2){
ctx.beginPath();
ctx.moveTo(250,50);
ctx.lineTo(250,250);
ctx.stroke();
}
}

if(t.tipo==="corredera"){
ctx.strokeRect(50,100,400,100);
}

if(t.tipo==="autoportante"){
ctx.strokeRect(50,100,400,100);
ctx.fillRect(400,100,50,100);
}

if(t.tipo==="barandilla"){
ctx.strokeRect(50,150,400,50);
}

if(t.tipo==="valla"){
ctx.strokeRect(50,150,400,50);
}
}

</script>

</body>
</html>
