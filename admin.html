<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MSTCALC V53 - CÁLCULO DE REPARTO Y BARROTES</title>
    <style>
        :root { 
            --p: #0f172a; --s: #3b82f6; --bg: #f1f5f9; --success: #10b981; 
            --border: #cbd5e1; --sidebar-w: 280px;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); display: flex; color: #1e293b; min-height: 100vh; }
        
        /* SIDEBAR COMPLETO RESTAURADO */
        .sidebar { width: var(--sidebar-w); background: var(--p); height: 100vh; color: white; padding: 25px; position: fixed; overflow-y: auto; border-right: 4px solid var(--s); z-index: 100; }
        .sidebar h2 { color: var(--s); font-size: 1.4rem; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .nav-group-title { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin: 25px 0 10px 0; font-weight: 900; letter-spacing: 1px; }
        .nav-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; color: #cbd5e1; font-size: 0.85rem; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: white; }
        .nav-item.active { background: var(--s); color: white; font-weight: 600; }

        .main-content { margin-left: var(--sidebar-w); padding: 40px; width: calc(100% - var(--sidebar-w)); }
        .view { display: none; max-width: 1200px; margin: 0 auto; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }

        .card { background: white; padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; }
        .flex { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .flex > div { flex: 1; min-width: 140px; }
        
        label { display: block; font-size: 0.7rem; font-weight: 800; color: #64748b; margin-bottom: 5px; text-transform: uppercase; }
        input, select { padding: 8px; border: 2px solid #f1f5f9; border-radius: 6px; width: 100%; background: #f8fafc; font-size: 0.85rem; }
        
        .result-box { background: #0f172a; color: #f8fafc; padding: 20px; border-radius: 12px; font-family: 'Consolas', monospace; margin-top: 15px; border-left: 5px solid var(--s); }
        .corte-item { background: #1e293b; padding: 10px; border-radius: 6px; border: 1px solid #334155; margin-bottom: 8px; }
        
        canvas { background: #1e293b; border-radius: 8px; width: 100%; height: auto; border: 2px solid #334155; }
        .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.6rem; font-weight: bold; }
        .badge-perfil { background: #e0f2fe; color: #0369a1; }
        .badge-chapa { background: #fef3c7; color: #92400e; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MSTCALC V53</h2>
        <div class="nav-item active" onclick="showView('v-puertas', this)">🚪 Puertas</div>
        <div class="nav-item" onclick="showView('v-barandillas', this)">🪜 Barandillas</div>
        <div class="nav-item" onclick="showView('v-prontuario', this)">📖 Prontuario Maestro</div>
        <div class="nav-item" onclick="showView('v-stock', this)">🏗️ Stock</div>
        <div class="nav-group-title">Proyecto</div>
        <div class="nav-item" onclick="showView('v-datos', this)">📝 Datos Generales</div>
    </div>

    <div class="main-content">
        <div id="v-puertas" class="view active">
            <h1>🚪 Configuración Técnica de Puerta</h1>
            
            <div class="card">
                <div class="flex">
                    <div><label>Ancho W</label><input type="number" id="dr-w" value="2000" oninput="calcPuerta()"></div>
                    <div><label>Alto H</label><input type="number" id="dr-h" value="2100" oninput="calcPuerta()"></div>
                    <div><label>Hojas</label><select id="dr-tipo" onchange="calcPuerta()"><option value="1">1 Hoja</option><option value="2" selected>2 Hojas</option></select></div>
                </div>
            </div>

            <div class="flex">
                <div class="card" style="flex: 2;">
                    <label style="color:var(--s);">1. Materiales Base</label>
                    <div class="flex">
                        <div><label>Perfil Marco</label><select id="dr-mat-marco" onchange="calcPuerta()"></select></div>
                        <div><label>Perfil Hoja</label><select id="dr-mat-hoja" onchange="calcPuerta()"></select></div>
                        <div><label>Frente Marco</label><select id="dr-ori-m" onchange="calcPuerta()"><option value="a">Cara A</option><option value="b">Cara B</option></select></div>
                    </div>
                    
                    <label style="margin-top:20px; color:var(--s);">2. Configuración de Relleno</label>
                    <div class="flex">
                        <div><label>Relleno</label><select id="dr-relleno" onchange="toggleInputsRelleno(); calcPuerta();">
                            <option value="nada">Vacío</option>
                            <option value="chapa">Chapa</option>
                            <option value="barrotes">Barrotes</option>
                            <option value="mixto">Chapa + Barrotes</option>
                        </select></div>
                        
                        <div id="box-barrotes" style="display:none; flex: 2; border-left: 2px solid var(--s); padding-left: 15px;">
                            <div class="flex">
                                <div><label>Perfil Barrote</label><select id="dr-mat-barrote" onchange="calcPuerta()"></select></div>
                                <div><label>Hueco Máx (mm)</label><input type="number" id="dr-dist-max" value="110" oninput="calcPuerta()"></div>
                            </div>
                        </div>

                        <div id="box-chapa" style="display:none;">
                            <label>Chapa</label><select id="dr-sel-chapa" onchange="calcPuerta()"></select>
                        </div>
                    </div>

                    <label style="margin-top:20px; color:var(--s);">3. Refuerzos Estructurales</label>
                    <div class="flex">
                        <div><label>Horizontales</label><input type="number" id="dr-ref-h" value="1" oninput="calcPuerta()"></div>
                        <div><label>Verticales</label><input type="number" id="dr-ref-v" value="0" oninput="calcPuerta()"></div>
                    </div>
                </div>

                <div class="card" style="flex: 1; background:#0f172a; min-height: 300px; display: flex; align-items: center; justify-content: center;">
                    <canvas id="dr-canvas" width="400" height="350"></canvas>
                </div>
            </div>

            <div id="dr-despiece"></div>
            <div class="result-box" id="dr-final"></div>
        </div>

        <div id="v-prontuario" class="view">
            <h1>📖 Prontuario Maestro</h1>
            <div class="card">
                <div class="flex">
                    <div><label>Tipo</label><select id="new-tipo"><option value="perfil">Perfil</option><option value="chapa">Chapa</option></select></div>
                    <div><label>Nombre</label><input type="text" id="new-nom"></div>
                    <div><label>A / Ancho</label><input type="number" id="new-a"></div>
                    <div><label>B / Largo</label><input type="number" id="new-b"></div>
                    <div><label>e</label><input type="number" id="new-e"></div>
                    <div><button onclick="addMaterial()" style="background:var(--success); color:white; border:none; padding:10px; border-radius:8px; cursor:pointer; width:100%;">Guardar</button></div>
                </div>
            </div>
            <div class="card"><table><thead><tr><th>Cat.</th><th>Ref</th><th>Medidas</th><th>Acción</th></tr></thead><tbody id="lista-mat-body"></tbody></table></div>
        </div>
    </div>

    <script>
        let materiales = [
            { tipo: 'perfil', nom: "Rect 80x40", a: 80, b: 40, e: 2 },
            { tipo: 'perfil', nom: "Cuad 40x40", a: 40, b: 40, e: 1.5 },
            { tipo: 'perfil', nom: "Macizo 20x20", a: 20, b: 20, e: 0 },
            { tipo: 'chapa', nom: "Chapa 2mm", a: 1000, b: 2000, e: 2 }
        ];

        function toggleInputsRelleno() {
            const r = document.getElementById('dr-relleno').value;
            document.getElementById('box-barrotes').style.display = (r === 'barrotes' || r === 'mixto') ? 'block' : 'none';
            document.getElementById('box-chapa').style.display = (r === 'chapa' || r === 'mixto') ? 'block' : 'none';
        }

        function addMaterial() {
            const t = document.getElementById('new-tipo').value;
            const n = document.getElementById('new-nom').value;
            const a = parseFloat(document.getElementById('new-a').value);
            const b = parseFloat(document.getElementById('new-b').value);
            const e = parseFloat(document.getElementById('new-e').value) || 0;
            if(n && a && b) { materiales.push({ tipo: t, nom: n, a: a, b: b, e: e }); actualizarInterfaz(); }
        }

        function actualizarInterfaz() {
            const perfiles = materiales.filter(m => m.tipo === 'perfil');
            const chapas = materiales.filter(m => m.tipo === 'chapa');
            
            document.getElementById('dr-mat-marco').innerHTML = perfiles.map((m, i) => `<option value="${i}">${m.nom}</option>`).join('');
            document.getElementById('dr-mat-hoja').innerHTML = perfiles.map((m, i) => `<option value="${i}">${m.nom}</option>`).join('');
            document.getElementById('dr-mat-barrote').innerHTML = perfiles.map((m, i) => `<option value="${i}">${m.nom}</option>`).join('');
            document.getElementById('dr-sel-chapa').innerHTML = chapas.map((m, i) => `<option value="${i}">${m.nom}</option>`).join('');
            
            document.getElementById('lista-mat-body').innerHTML = materiales.map((m, i) => `<tr><td>${m.tipo}</td><td>${m.nom}</td><td>${m.a}x${m.b}</td><td><button onclick="materiales.splice(${i},1); actualizarInterfaz()">❌</button></td></tr>`).join('');
            calcPuerta();
        }

        function calcPuerta() {
            const perfiles = materiales.filter(m => m.tipo === 'perfil');
            const pM = perfiles[document.getElementById('dr-mat-marco').value];
            const pH = perfiles[document.getElementById('dr-mat-hoja').value];
            const pB = perfiles[document.getElementById('dr-mat-barrote').value];
            
            const W = parseFloat(document.getElementById('dr-w').value) || 0;
            const H = parseFloat(document.getElementById('dr-h').value) || 0;
            const ori = document.getElementById('dr-ori-m').value;
            const eM = (ori === 'a') ? pM.a : pM.b;
            const eH = (ori === 'a') ? pH.a : pH.b;
            const eB = pB ? pB.a : 20; // Ancho del barrote

            const nH = parseInt(document.getElementById('dr-tipo').value);
            const relleno = document.getElementById('dr-relleno').value;
            const distMax = parseFloat(document.getElementById('dr-dist-max').value) || 110;

            const hH = (H - eM - 15) + 20; // Solape estándar
            const hW = ((W - (eM * 2) - 15) / nH) + (40 / nH);
            
            // CÁLCULO REPARTO BARROTES
            const luzInterna = hW - (eH * 2);
            const numHuecos = Math.ceil(luzInterna / (distMax + eB));
            const numBarrotes = numHuecos - 1;
            const distExacta = (luzInterna - (numBarrotes * eB)) / numHuecos;

            let htmlDespiece = `
                <div class="corte-item"><strong>MARCO:</strong> 2x ${H}mm | 1x ${W}mm</div>
                <div class="corte-item"><strong>HOJAS (${nH}):</strong> ${nH*2}x ${hH.toFixed(0)}mm | ${nH*2}x ${hW.toFixed(0)}mm</div>
            `;

            if(relleno === 'barrotes' || relleno === 'mixto') {
                htmlDespiece += `
                    <div class="corte-item" style="border-left-color:var(--success)">
                        <strong>BARROTES (${pB.nom}):</strong> ${numBarrotes * nH} piezas de ${(hH - (eH*2)).toFixed(0)}mm<br>
                        <small>Separación luz: ${distExacta.toFixed(1)}mm | Ejes: ${(distExacta + eB).toFixed(1)}mm</small>
                    </div>
                `;
            }

            document.getElementById('dr-despiece').innerHTML = htmlDespiece;
            document.getElementById('dr-final').innerHTML = `TALLER: ${nH} hojas de ${hW.toFixed(0)}x${hH.toFixed(0)}mm. Reparto: ${numBarrotes} barrotes por hoja.`;
            
            dibujarPuerta(W, H, eM, hW, hH, nH, eH, eB, numBarrotes, distExacta, relleno);
        }

        function dibujarPuerta(W, H, eM, hW, hH, nH, eH, eB, nB, dist, relleno) {
            const ctx = document.getElementById('dr-canvas').getContext('2d');
            ctx.clearRect(0,0,400,350);
            const s = Math.min(300/W, 250/H);
            const ox = (400 - W*s)/2; const oy = (350 - H*s)/2;

            ctx.strokeStyle = "#475569"; ctx.lineWidth = eM*s;
            ctx.strokeRect(ox + (eM*s/2), oy + (eM*s/2), (W-eM)*s, (H-eM/2)*s);

            ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 1;
            for(let i=0; i<nH; i++){
                const hx = ox + (eM*s) + (i*hW*s) - (i*10*s);
                ctx.strokeRect(hx, oy, hW*s, hH*s);
                
                // Dibujar Barrotes
                if(relleno === 'barrotes' || relleno === 'mixto') {
                    ctx.fillStyle = "#64748b";
                    for(let b=1; b<=nB; b++){
                        const bx = hx + (eH*s) + (b * (dist + eB) * s) - (eB * s);
                        ctx.fillRect(bx, oy + (eH*s), eB*s, (hH - eH*2)*s);
                    }
                }
            }
        }

        function showView(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        window.onload = actualizarInterfaz;
    </script>
</body>
</html>
