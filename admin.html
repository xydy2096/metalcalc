Aquí tienes el código completo. Copia todo el bloque y guárdalo como mstcalc.html:

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTCALC PRO</title>

<style>
:root { --p:#0f172a; --s:#3b82f6; --bg:#f1f5f9; --danger:#ef4444; --warn:#f59e0b; --ok:#10b981;}
*{box-sizing:border-box}
body{margin:0;display:flex;background:var(--bg);font-family:sans-serif;color:#0f172a}

/* SIDEBAR */
.sidebar{width:300px;background:var(--p);color:white;padding:20px;height:100vh;overflow:auto;}
.sidebar h2{margin:0 0 12px 0}
.nav-item{padding:12px;border-radius:8px;cursor:pointer;margin-bottom:5px;background:transparent;border:1px solid transparent;width:100%;text-align:left;color:white;font-size:0.95rem}
.nav-item:hover{background:#1e293b}
.nav-item.active{background:var(--s)}
.category-title{padding:10px;margin-top:10px;background:#1e293b;border-radius:8px;cursor:pointer;font-size:0.8rem;display:flex;justify-content:space-between;align-items:center;user-select:none}
.category-title .chev{transition:transform .2s}
.category-title.open .chev{transform:rotate(90deg)}
.submenu{display:none;padding-left:10px;margin-top:4px}
.submenu.open{display:block}

/* MAIN */
.main{flex:1;padding:30px;overflow:auto;height:100vh}
.view{display:none}
.view.active{display:block}
.card{background:white;padding:20px;border-radius:12px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.grid{display:grid;grid-template-columns:1fr 480px;gap:20px;}
input,select{width:100%;padding:10px;margin-top:5px;border:1px solid #ddd;border-radius:6px;font-size:0.95rem}
button{margin-top:10px;padding:10px 14px;cursor:pointer;border:none;border-radius:8px;background:var(--s);color:white;font-size:0.9rem}
button:hover{opacity:.92}
button.secondary{background:#64748b}
button.danger{background:var(--danger)}
button.warn{background:var(--warn)}
button.ok{background:var(--ok)}
.res{background:#111;color:#0f0;padding:15px;border-radius:10px;font-family:monospace;min-height:60px}
canvas{width:100%;background:#000;}

/* LIST WITH ACTIONS */
.list{display:flex;flex-direction:column;gap:8px}
.item{padding:10px 12px;background:#f8fafc;border-radius:6px;border:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center;gap:10px}
.item .info{flex:1;min-width:0}
.item .actions{display:flex;gap:6px;flex-shrink:0}
.item .actions button{margin-top:0;padding:6px 10px;font-size:0.8rem}
.empty{padding:14px;text-align:center;color:#64748b;background:#f8fafc;border:1px dashed #cbd5e1;border-radius:8px}

/* TOOLBAR */
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.toolbar h3{margin:0}
.toolbar .tools{display:flex;gap:8px;flex-wrap:wrap}
.toolbar .tools button{margin-top:0}
.badge{display:inline-block;padding:2px 8px;background:#e2e8f0;color:#334155;border-radius:999px;font-size:0.75rem;margin-left:8px;vertical-align:middle}

/* MODAL */
.modal-back{display:none;position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:100;align-items:center;justify-content:center;padding:16px}
.modal-back.open{display:flex}
.modal{background:white;border-radius:12px;padding:22px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px 0}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.modal label{font-size:0.85rem;color:#334155;margin-top:8px;display:block}

@media (max-width: 900px){
  body{flex-direction:column}
  .sidebar{width:100%; height:auto; }
  .main{padding:16px;height:auto}
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<div class="main">

  <!-- PROYECTO -->

<!-- MODAL GENÉRICO -->

<script>
/* =========================================================
   DATOS Y CONFIGURACIÓN DE CATEGORÍAS
   Stock  = inventario editable
   Prontuario = catálogo de referencia (independiente)
   ========================================================= */
const STORE_KEYS = {
  stockMat:  "mst_stock_materiales",
  stockPint: "mst_stock_pinturas",
  pronMat:   "mst_prontuario_materiales",
  pronPint:  "mst_prontuario_pinturas",
  hist:      "mst_hist"
}

/* Definición de campos por categoría (para modal y render) */
const CATEGORIES = {
  stockMat: {
    label:"Material (Stock)",
    listId:"list-stockMat",
    countId:"count-stock-mat",
    fields:[
      {key:"nombre", label:"Nombre", type:"text", required:true},
      {key:"cantidad", label:"Cantidad", type:"number", required:true, min:0},
      {key:"zona", label:"Zona (A1, B2...)", type:"text"}
    ],
    render:(it)=>`<b>${escapeHtml(it.nombre)}</b> — ${it.cantidad} ud${it.zona?` · Zona ${escapeHtml(it.zona)}`:""}`
  },
  stockPint: {
    label:"Pintura (Stock)",
    listId:"list-stockPint",
    countId:"count-stock-pint",
    fields:[
      {key:"nombre", label:"Nombre pintura", type:"text", required:true},
      {key:"codigo", label:"Código", type:"text"},
      {key:"cantidad", label:"Cantidad (L)", type:"number", min:0}
    ],
    render:(it)=>`<b>${escapeHtml(it.nombre)}</b>${it.codigo?` · ${escapeHtml(it.codigo)}`:""}${it.cantidad!=null&&it.cantidad!==""?` · ${it.cantidad} L`:""}`
  },
  pronMat: {
    label:"Material (Prontuario)",
    listId:"list-pronMat",
    countId:"count-pron-mat",
    fields:[
      {key:"nombre", label:"Nombre", type:"text", required:true},
      {key:"tipo", label:"Tipo / Perfil", type:"text"},
      {key:"unidad", label:"Unidad (mm, m, kg…)", type:"text"},
      {key:"notas", label:"Notas", type:"text"}
    ],
    render:(it)=>`<b>${escapeHtml(it.nombre)}</b>${it.tipo?` · ${escapeHtml(it.tipo)}`:""}${it.unidad?` [${escapeHtml(it.unidad)}]`:""}${it.notas?` — ${escapeHtml(it.notas)}`:""}`
  },
  pronPint: {
    label:"Pintura (Prontuario)",
    listId:"list-pronPint",
    countId:"count-pron-pint",
    fields:[
      {key:"nombre", label:"Nombre pintura", type:"text", required:true},
      {key:"codigo", label:"Código RAL / referencia", type:"text"},
      {key:"acabado", label:"Acabado (mate, satinado…)", type:"text"},
      {key:"notas", label:"Notas", type:"text"}
    ],
    render:(it)=>`<b>${escapeHtml(it.nombre)}</b>${it.codigo?` · ${escapeHtml(it.codigo)}`:""}${it.acabado?` · ${escapeHtml(it.acabado)}`:""}${it.notas?` — ${escapeHtml(it.notas)}`:""}`
  }
}

/* Carga inicial desde localStorage con compatibilidad hacia atrás */
function loadData(cat){
  try { return JSON.parse(localStorage.getItem(STORE_KEYS[cat])) || [] }
  catch { return [] }
}
function saveData(cat, arr){
  localStorage.setItem(STORE_KEYS[cat], JSON.stringify(arr))
}

// Migración amable de datos antiguos (una sola vez)
;(function migrate(){
  if(!localStorage.getItem(STORE_KEYS.stockMat)){
    const legacy = JSON.parse(localStorage.getItem("mst_materiales")||"[]")
    if(legacy.length) saveData("stockMat", legacy.map(m=>({nombre:m.nombre, cantidad:m.cantidad, zona:""})))
  }
  if(!localStorage.getItem(STORE_KEYS.stockPint)){
    const legacy = JSON.parse(localStorage.getItem("mst_pinturas")||"[]")
    if(legacy.length) saveData("stockPint", legacy.map(p=>({nombre:p.nombre, codigo:p.codigo||"", cantidad:""})))
  }
  if(!localStorage.getItem(STORE_KEYS.stockMat) || JSON.parse(localStorage.getItem(STORE_KEYS.stockMat)||"[]").length===0){
    const legacyStock = JSON.parse(localStorage.getItem("mst_stock")||"[]")
    if(legacyStock.length){
      const existing = loadData("stockMat")
      const merged = existing.concat(legacyStock.map(s=>({nombre:s.pieza, cantidad:s.largo, zona:s.zona})))
      saveData("stockMat", merged)
    }
  }
})()

const data = {
  stockMat: loadData("stockMat"),
  stockPint: loadData("stockPint"),
  pronMat: loadData("pronMat"),
  pronPint: loadData("pronPint")
}
let historial = JSON.parse(localStorage.getItem(STORE_KEYS.hist)) || []
let proyectoActual = {}

/* =========================================================
   UI: TOGGLE / NAVEGACIÓN
   ========================================================= */
function toggle(id, el){
  const sub = document.getElementById(id)
  if(!sub) return
  sub.classList.toggle('open')
  if(el) el.classList.toggle('open')
}

function showView(id, el){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'))
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'))
  const view = document.getElementById(id)
  if(view) view.classList.add('active')
  if(el) el.classList.add('active')

  if(id==="v-historial") renderHistorial()
  if(id==="v-stock-materiales")       renderCategory("stockMat")
  if(id==="v-stock-pinturas")         renderCategory("stockPint")
  if(id==="v-prontuario-materiales")  renderCategory("pronMat")
  if(id==="v-prontuario-pinturas")    renderCategory("pronPint")
}

/* =========================================================
   CRUD GENÉRICO POR CATEGORÍA
   ========================================================= */
function escapeHtml(s){
  if(s==null) return ""
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))
}

function renderCategory(cat){
  const cfg = CATEGORIES[cat]
  const cont = document.getElementById(cfg.listId)
  const count = document.getElementById(cfg.countId)
  if(!cont) return
  const items = data[cat]
  if(count) count.textContent = items.length
  if(!items.length){
    cont.innerHTML = `<div class="empty">Sin entradas. Pulsa “Agregar” para crear la primera.</div>`
    return
  }
  cont.innerHTML = items.map((it,i)=>`
    <div class="item" data-testid="item-${cat}-${i}">
      <div class="info">${cfg.render(it)}</div>
      <div class="actions">
        <button class="warn" data-testid="edit-${cat}-${i}" onclick="openModal('${cat}',${i})">Editar</button>
        <button class="danger" data-testid="del-${cat}-${i}" onclick="deleteItem('${cat}',${i})">Eliminar</button>
      </div>
    </div>`).join("")
}

/* ========= MODAL GENÉRICO (Agregar / Editar) ========= */
let modalState = { cat:null, index:null }

function openModal(cat, index=null){
  const cfg = CATEGORIES[cat]
  if(!cfg) return
  modalState = { cat, index }
  document.getElementById("modalTitle").textContent = (index===null?"Agregar ":"Editar ") + cfg.label
  const fieldsHtml = cfg.fields.map(f=>{
    const val = index!=null ? (data[cat][index]?.[f.key] ?? "") : ""
    return `
      <label>${f.label}${f.required?" *":""}</label>
      <input data-field="${f.key}" type="${f.type||'text'}" ${f.min!=null?`min="${f.min}"`:""} value="${escapeHtml(val)}" data-testid="modal-field-${f.key}">
    `
  }).join("")
  document.getElementById("modalFields").innerHTML = fieldsHtml
  document.getElementById("modalBack").classList.add("open")
  setTimeout(()=>{ const first=document.querySelector("#modalFields input"); if(first) first.focus() },50)
}

function closeModal(){
  document.getElementById("modalBack").classList.remove("open")
  modalState = { cat:null, index:null }
}
function closeModalOnBack(e){
  if(e.target.id==="modalBack") closeModal()
}

function modalSave(){
  const { cat, index } = modalState
  if(!cat) return
  const cfg = CATEGORIES[cat]
  const obj = {}
  for(const f of cfg.fields){
    const input = document.querySelector(`#modalFields input[data-field="${f.key}"]`)
    let v = input ? input.value.trim() : ""
    if(f.required && !v){ alert(`El campo "${f.label}" es obligatorio`); input?.focus(); return }
    if(f.type==="number" && v!==""){
      const n = Number(v)
      if(!isFinite(n)){ alert(`"${f.label}" debe ser numérico`); return }
      v = n
    }
    obj[f.key] = v
  }
  if(index===null) data[cat].push(obj)
  else data[cat][index] = obj
  saveData(cat, data[cat])
  renderCategory(cat)
  closeModal()
}

function deleteItem(cat, index){
  if(!confirm("¿Eliminar esta entrada?")) return
  data[cat].splice(index,1)
  saveData(cat, data[cat])
  renderCategory(cat)
}

/* Botones "Editar" / "Eliminar" superiores (atajo: pide índice) */
function promptEdit(cat){
  const items = data[cat]
  if(!items.length){ alert("No hay entradas para editar."); return }
  const idx = askIndex(items, "editar")
  if(idx!=null) openModal(cat, idx)
}
function promptDelete(cat){
  const items = data[cat]
  if(!items.length){ alert("No hay entradas para eliminar."); return }
  const idx = askIndex(items, "eliminar")
  if(idx!=null) deleteItem(cat, idx)
}
function askIndex(items, verbo){
  const list = items.map((it,i)=>`${i+1}. ${it.nombre||"(sin nombre)"}`).join("\n")
  const raw = prompt(`Indica el nº a ${verbo}:\n\n${list}`)
  if(raw===null) return null
  const n = parseInt(raw,10)
  if(!isFinite(n) || n<1 || n>items.length){ alert("Número inválido"); return null }
  return n-1
}

/* =========================================================
   ABATIBLES (se mantiene la lógica existente)
   ========================================================= */
function runAb(){
  const W = Number(document.getElementById("ab-w").value)
  const H = Number(document.getElementById("ab-h").value)
  const n = Number(document.getElementById("ab-n").value)
  const res = document.getElementById("ab-res")
  if(!isFinite(W)||!isFinite(H)||!isFinite(n)||W<=0||H<=0||n<=0){ res.innerHTML="Entradas inválidas"; return }
  const hoja = W / n
  const despiece = [
    {pieza:"Vertical", cantidad:n*2, largo:H},
    {pieza:"Horizontal", cantidad:n*2, largo:hoja}
  ]
  let html = despiece.map(p=>`${p.pieza} → ${p.cantidad} x ${p.largo}`).join("<br>")
  const avisos = comprobarStock(despiece)
  if(avisos.length) html += "<br><br><b>STOCK:</b><br>" + avisos.join("<br>")
  res.innerHTML = html
  proyectoActual = { tipo:"abatible", datos:{W,H,n}, despiece }
  dibujar(W,H,n)
}

function comprobarStock(despiece){
  // Para coincidencias usamos el inventario de Stock · Materiales (nombre + cantidad suficiente)
  const inventario = data.stockMat
  const avisos = []
  despiece.forEach(p=>{
    const m = inventario.find(s=> (s.nombre||"").toLowerCase()===p.pieza.toLowerCase() && Number(s.cantidad)>=p.largo)
    if(m) avisos.push(`✔ Usar ${m.nombre} (${m.cantidad})${m.zona?` en zona ${m.zona}`:""}`)
  })
  return avisos
}

function dibujar(W,H,n){
  const canvas = document.getElementById("cv")
  if(!canvas) return
  const ctx = canvas.getContext("2d")
  ctx.clearRect(0,0,400,300)
  ctx.strokeStyle="white"
  ctx.strokeRect(50,60,300,180)
  if(n==2){ ctx.beginPath(); ctx.moveTo(200,60); ctx.lineTo(200,240); ctx.stroke() }
}

/* =========================================================
   PROYECTO / HISTORIAL
   ========================================================= */
function guardarProyecto(){
  const pNombre = document.getElementById("p-nombre").value
  const pCliente = document.getElementById("p-cliente").value
  proyectoActual.nombre = pNombre
  proyectoActual.cliente = pCliente
  proyectoActual.fecha = new Date().toISOString()
  historial.push({...proyectoActual})
  localStorage.setItem(STORE_KEYS.hist, JSON.stringify(historial))
  if(window.firebase){
    try{ firebase.firestore().collection("trabajos").add(proyectoActual) }
    catch(e){ console.warn("Firebase no disponible:", e) }
  }
  alert("Guardado OK")
}

function renderHistorial(){
  const cont = document.getElementById("historial-lista")
  if(!cont) return
  if(!historial.length){ cont.innerHTML = `<div class="empty">Aún no hay proyectos guardados.</div>`; return }
  cont.innerHTML = historial.map(p=>
    `<div class="item"><div class="info"><b>${escapeHtml(p.nombre||"(sin nombre)")}</b> (${escapeHtml(p.tipo||"-")})${p.fecha?` — ${new Date(p.fecha).toLocaleString()}`:""}</div></div>`
  ).join("")
}

/* =========================================================
   INIT
   ========================================================= */
window.onload = function(){
  runAb()
  renderHistorial()
  renderCategory("stockMat")
  renderCategory("stockPint")
  renderCategory("pronMat")
  renderCategory("pronPint")

  // Cerrar modal con ESC
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape") closeModal()
    if(e.key==="Enter" && document.getElementById("modalBack").classList.contains("open")){
      // Guarda al pulsar Enter dentro del modal
      if(document.activeElement && document.activeElement.tagName==="INPUT") modalSave()
    }
  })
}
