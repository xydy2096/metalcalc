<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MSTCALC V9 - Sistema Integral Definitivo</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --p: #0f172a; --s: #3b82f6; --bg: #f1f5f9; --success: #10b981; --accent: #f59e0b; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); display: flex; color: #1e293b; }
        
        .sidebar { width: 260px; background: var(--p); height: 100vh; color: white; padding: 25px; position: fixed; box-shadow: 4px 0 10px rgba(0,0,0,0.1); }
        .sidebar h2 { color: var(--s); border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 25px; }
        .nav-item { padding: 12px; margin-bottom: 8px; border-radius: 10px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-item:hover, .nav-item.active { background: #1e293b; color: var(--s); font-weight: bold; }

        .main-content { margin-left: 260px; padding: 40px; width: calc(100% - 260px); }
        .view { display: none; }
        .view.active { display: block; }

        .card { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #e2e8f0; }
        .flex { display: flex; gap: 20px; margin-bottom: 15px; flex-wrap: wrap; align-items: flex-end; }
        .flex > div { flex: 1; min-width: 150px; }

        label { display: block; font-size: 0.75rem; font-weight: bold; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        input, select { padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; width: 100%; box-sizing: border-box; }

        /* Buscador */
        .search-box { position: relative; }
        .results-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #e2e8f0; border-radius: 8px; z-index: 1000; display: none; max-height: 180px; overflow-y: auto; }
        .result-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #f1f5f9; font-size: 0.85rem; }
        .result-item:hover { background: #f8fafc; color: var(--s); }

        /* Planos */
        .canvas-container { display: flex; gap: 20px; background: #1e293b; padding: 20px; border-radius: 15px; justify-content: center; }
        canvas { background: #0f172a; border-radius: 10px; border: 2px solid #334155; }

        button { padding: 12px 20px; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-add { background: var(--p); color: white; width: 100%; }
        .btn-send { background: var(--success); color: white; width: 100%; font-size: 1.2rem; padding: 20px; }

        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; color: #64748b; font-size: 0.7rem; padding: 12px; text-align: left; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
        .total-banner { background: var(--p); color: white; padding: 25px; border-radius: 15px; margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MSTCALC V9</h2>
        <div class="nav-item active" onclick="showView('v-inicio')">🏠 Proyecto</div>
        <div class="nav-item" onclick="showView('v-puerta')">📐 Puertas</div>
        <div class="nav-item" onclick="showView('v-barandilla')">🪜 Barandillas</div>
        <div class="nav-item" onclick="showView('v-stock')">📕 Prontuario</div>
        <div class="nav-item" onclick="showView('v-resumen')">🧾 Presupuesto</div>
    </div>

    <div class="main-content">
        <div id="v-inicio" class="view active">
            <h1>Registro de Obra</h1>
            <div class="card"><input type="text" id="id_obra" placeholder="Nombre del Cliente..." style="font-size: 1.5rem;"></div>
        </div>

        <div id="v-puerta" class="view">
            <h1>Configurador de Puertas</h1>
            <div class="flex">
                <div style="flex: 1.5;">
                    <div class="card">
                        <h3>Medidas Hueco</h3>
                        <div class="flex">
                            <div><label>Ancho</label><input type="number" id="p-w" value="1000" oninput="calcularP()"></div>
                            <div><label>Alto</label><input type="number" id="p-h" value="2000" oninput="calcularP()"></div>
                            <div><label>Marco</label><select id="p-marco-tipo" onchange="calcularP()"><option value="completo">Completo</option><option value="u">En U</option></select></div>
                        </div>
                        <div class="flex">
                            <div class="search-box" style="flex:2">
                                <label>Perfil Marco</label>
                                <input type="text" id="m-marco-search" onkeyup="buscador(this, 'marco')">
                                <div id="res-marco" class="results-list"></div>
                            </div>
                            <div><label>Cara</label><select id="p-cara-m" onchange="calcularP()"><option value="a">A</option><option value="b">B</option></select></div>
                        </div>
                        <div class="flex">
                            <div class="search-box" style="flex:2">
                                <label>Perfil Hoja</label>
                                <input type="text" id="m-hoja-search" onkeyup="buscador(this, 'hoja')">
                                <div id="res-hoja" class="results-list"></div>
                            </div>
                            <div><label>Cara</label><select id="p-cara-h" onchange="calcularP()"><option value="a">A</option><option value="b">B</option></select></div>
                        </div>
                    </div>
                    <div class="card" style="border-left: 5px solid var(--accent);">
                        <h3>Holguras (mm)</h3>
                        <div class="flex">
                            <div><label>Sup</label><input type="number" id="f-sup" value="5" oninput="calcularP()"></div>
                            <div><label>Inf</label><input type="number" id="f-inf" value="10" oninput="calcularP()"></div>
                            <div><label>Izq</label><input type="number" id="f-izq" value="5" oninput="calcularP()"></div>
                            <div><label>Der</label><input type="number" id="f-der" value="5" oninput="calcularP()"></div>
                        </div>
                        <button class="btn-add" onclick="añadirPuerta()">AÑADIR PUERTA</button>
                    </div>
                </div>
                <div style="flex: 1;">
                    <div class="canvas-container" style="flex-direction:column">
                        <canvas id="c-marco" width="280" height="280"></canvas>
                        <canvas id="c-hoja" width="280" height="280"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div id="v-barandilla" class="view">
            <h1>Configurador de Barandillas</h1>
            <div class="card">
                <div class="flex">
                    <div><label>Longitud (mm)</label><input type="number" id="b-l" value="2000"></div>
                    <div><label>Altura (mm)</label><input type="number" id="b-h" value="1000"></div>
                    <div><label>Nº Postes</label><input type="number" id="b-postes" value="2"></div>
                    <div><label>Nº Barrotes</label><input type="number" id="b-cant-bar" value="15"></div>
                </div>
                <div class="flex">
                    <div class="search-box">
                        <label>Pasamanos</label>
                        <input type="text" id="m-pasa-search" onkeyup="buscador(this, 'pasa')">
                        <div id="res-pasa" class="results-list"></div>
                    </div>
                    <div class="search-box">
                        <label>Postes</label>
                        <input type="text" id="m-poste-search" onkeyup="buscador(this, 'poste')">
                        <div id="res-poste" class="results-list"></div>
                    </div>
                    <div class="search-box">
                        <label>Barrotes</label>
                        <input type="text" id="m-bar-search" onkeyup="buscador(this, 'bar')">
                        <div id="res-bar" class="results-list"></div>
                    </div>
                </div>
                <button class="btn-add" onclick="añadirBarandilla()">AÑADIR BARANDILLA</button>
            </div>
        </div>

        <div id="v-stock" class="view">
            <h1>📕 Prontuario de Perfiles</h1>
            <div class="card">
                <div class="flex">
                    <input type="text" id="st-n" placeholder="Nombre">
                    <input type="number" id="st-a" placeholder="Cara A">
                    <input type="number" id="st-b" placeholder="Cara B">
                    <input type="number" id="st-p" placeholder="€/m">
                    <button onclick="guardarP()" style="background:var(--s); color:white;">GUARDAR</button>
                </div>
                <div id="cont-tabla-p"></div>
            </div>
        </div>

        <div id="v-resumen" class="view">
            <h1>🧾 Resumen y Presupuesto</h1>
            <div class="card" id="resumen-lista"></div>
            <div class="card">
                <div class="flex">
                    <div><label>Mano Obra (€)</label><input type="number" id="mano-obra" value="100" oninput="renderResumen()"></div>
                    <div><label>Mult. Material</label><input type="number" id="mult-mat" value="1.1" step="0.1" oninput="renderResumen()"></div>
                    <div><label>Varios (€)</label><input type="number" id="varios" value="30" oninput="renderResumen()"></div>
                    <div><label>% Beneficio</label><input type="number" id="margen" value="30" oninput="renderResumen()"></div>
                </div>
                <div class="total-banner">
                    <h2 id="total-txt">0.00 €</h2>
                    <button class="btn-send" onclick="enviarTaller()">🚀 ENVIAR AL TALLER</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0", authDomain: "mstcalc.firebaseapp.com", projectId: "mstcalc", storageBucket: "mstcalc.firebasestorage.app", messagingSenderId: "68220801288", appId: "1:68220801288:web:cf0a033e03658c3f579cbd" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let obraItems = [];
    let prontuario = JSON.parse(localStorage.getItem('prontuario_v9')) || {};

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'v-resumen') renderResumen();
        if(id === 'v-stock') renderProntuario();
    }

    function buscador(input, tipo) {
        const val = input.value.toLowerCase();
        const resDiv = document.getElementById('res-' + tipo);
        resDiv.innerHTML = "";
        if(!val) { resDiv.style.display="none"; return; }
        for(let key in prontuario) {
            if(key.toLowerCase().includes(val)) {
                let d = document.createElement('div');
                d.className="result-item"; d.innerText=key;
                d.onclick=()=>{ input.value=key; resDiv.style.display="none"; calcularP(); };
                resDiv.appendChild(d);
            }
        }
        resDiv.style.display="block";
    }

    function calcularP() {
        const W = parseFloat(document.getElementById('p-w').value) || 0;
        const H = parseFloat(document.getElementById('p-h').value) || 0;
        const matM = document.getElementById('m-marco-search').value;
        const gM = prontuario[matM] ? parseFloat(prontuario[matM][document.getElementById('p-cara-m').value]) : 0;
        const tipoM = document.getElementById('p-marco-tipo').value;
        
        const wH = W - (gM*2) - (parseFloat(document.getElementById('f-izq').value) + parseFloat(document.getElementById('f-der').value));
        const hH = H - (gM*(tipoM==='completo'?2:1)) - (parseFloat(document.getElementById('f-sup').value) + parseFloat(document.getElementById('f-inf').value));

        dibujar('c-marco', W, H, gM, tipoM, "#64748b", "MARCO", W, H);
        dibujar('c-hoja', wH, hH, 40, "completo", "#3b82f6", "HOJA", wH, hH);
    }

    function dibujar(id, W, H, gR, tipo, color, titulo, tW, tH) {
        const c = document.getElementById(id); const ctx = c.getContext('2d');
        ctx.clearRect(0,0,280,280);
        const esc = Math.min(220/W, 220/H);
        const ox = (280-W*esc)/2, oy = (280-H*esc)/2;
        const g = (gR || 2) * esc;
        ctx.strokeStyle=color; ctx.lineWidth=g;
        ctx.beginPath();
        ctx.moveTo(ox+g/2, oy+H*esc); ctx.lineTo(ox+g/2, oy+g/2); ctx.lineTo(ox+W*esc-g/2, oy+g/2); ctx.lineTo(ox+W*esc-g/2, oy+H*esc);
        if(tipo==='completo') ctx.lineTo(ox+g/2, oy+H*esc);
        ctx.stroke();
        ctx.fillStyle="white"; ctx.fillText(`${titulo}: ${Math.round(tW)}x${Math.round(tH)}`, 10, 20);
    }

    function añadirPuerta() {
        const W = parseFloat(document.getElementById('p-w').value);
        const H = parseFloat(document.getElementById('p-h').value);
        const matM = document.getElementById('m-marco-search').value;
        const matH = document.getElementById('m-hoja-search').value;
        const gM = prontuario[matM] ? parseFloat(prontuario[matM][document.getElementById('p-cara-m').value]) : 0;
        const tipoM = document.getElementById('p-marco-tipo').value;
        const wH = W - (gM*2) - (parseFloat(document.getElementById('f-izq').value) + parseFloat(document.getElementById('f-der').value));
        const hH = H - (gM*(tipoM==='completo'?2:1)) - (parseFloat(document.getElementById('f-sup').value) + parseFloat(document.getElementById('f-inf').value));

        obraItems.push({
            obra: document.getElementById('id_obra').value,
            piezas: [
                {m: matM, l: W, c: (tipoM==='u'?1:2), t: "Marco H"},
                {m: matM, l: H, c: 2, t: "Marco V"},
                {m: matH, l: wH, c: 2, t: "Hoja H"},
                {m: matH, l: hH, c: 2, t: "Hoja V"}
            ],
            imgs: [document.getElementById('c-marco').toDataURL(), document.getElementById('c-hoja').toDataURL()]
        });
        alert("Puerta Añadida");
    }

    function añadirBarandilla() {
        const L = parseFloat(document.getElementById('b-l').value);
        const H = parseFloat(document.getElementById('b-h').value);
        obraItems.push({
            obra: document.getElementById('id_obra').value,
            piezas: [
                {m: document.getElementById('m-pasa-search').value, l: L, c: 1, t: "Pasamanos"},
                {m: document.getElementById('m-poste-search').value, l: H, c: document.getElementById('b-postes').value, t: "Postes"},
                {m: document.getElementById('m-bar-search').value, l: H-80, c: document.getElementById('b-cant-bar').value, t: "Barrotes"}
            ],
            imgs: []
        });
        alert("Barandilla Añadida");
    }

    function renderResumen() {
        let mat = 0;
        let h = "<table><tr><th>Material</th><th>Corte</th><th>Cant</th><th>Sub</th></tr>";
        const m = parseFloat(document.getElementById('mult-mat').value);
        obraItems.forEach(it => {
            it.piezas.forEach(p => {
                let cost = (p.l/1000) * p.c * (prontuario[p.m]?.p || 0);
                mat += (cost * m);
                h += `<tr><td>${p.m}</td><td>${Math.round(p.l)}mm</td><td>${p.c}</td><td>${(cost*m).toFixed(2)}€</td></tr>`;
            });
        });
        const total = (mat + parseFloat(document.getElementById('mano-obra').value) + parseFloat(document.getElementById('varios').value)) * ((parseFloat(document.getElementById('margen').value)/100)+1);
        document.getElementById('total-txt').innerText = total.toFixed(2) + " €";
        document.getElementById('resumen-lista').innerHTML = h + "</table>";
    }

    async function enviarTaller() {
        for(let it of obraItems) {
            it.imgs.forEach((img, i) => db.collection("materiales").add({ trabajo: it.obra, nombre: "PLANO", imagen: img, estado: "info", fecha: new Date() }));
            for(let p of it.piezas) await db.collection("materiales").add({ trabajo: it.obra, nombre: p.m + " ("+p.t+")", medida: Math.round(p.l)+"mm", cantidad: p.c, estado: "pendiente", fecha: new Date() });
        }
        alert("Enviado"); location.reload();
    }

    function guardarP() {
        const n = document.getElementById('st-n').value;
        prontuario[n] = { a: document.getElementById('st-a').value, b: document.getElementById('st-b').value, p: document.getElementById('st-p').value };
        localStorage.setItem('prontuario_v9', JSON.stringify(prontuario)); renderProntuario();
    }

    function renderProntuario() {
        let h = "<table>";
        for(let k in prontuario) h += `<tr><td>${k}</td><td>${prontuario[k].a}x${prontuario[k].b}</td><td><button onclick="borrarP('${k}')">❌</button></td></tr>`;
        document.getElementById('cont-tabla-p').innerHTML = h + "</table>";
    }
    function borrarP(k) { delete prontuario[k]; localStorage.setItem('prontuario_v9', JSON.stringify(prontuario)); renderProntuario(); }
</script>
</body>
</html>
