<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTCALC - Control de Producción</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --p: #0f172a; --s: #3b82f6; --bg: #f1f5f9; --txt: #334155; --accent: #f39c12; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: var(--txt); display: flex; }
        .sidebar { width: 250px; background: var(--p); height: 100vh; color: white; padding: 20px; position: fixed; }
        .sidebar h2 { color: var(--s); font-size: 1.2rem; margin-bottom: 30px; }
        .nav-item { padding: 12px; margin-bottom: 10px; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        .nav-item:hover, .nav-item.active { background: rgba(255,255,255,0.1); color: var(--s); }
        .main-content { margin-left: 250px; padding: 40px; width: calc(100% - 250px); }
        .view { display: none; } .view.active { display: block; }
        .input-box { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .flex { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; flex: 1; min-width: 150px; }
        button { padding: 12px 20px; background: var(--s); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .resumen-total { background: var(--p); color: white; padding: 20px; border-radius: 10px; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; background: white; margin-top: 10px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MSTCALC PRO</h2>
        <div class="nav-item active" onclick="showView('v-inicio')">🏠 Inicio</div>
        <div class="nav-item" onclick="showView('v-modulos')">🧩 Módulos de Trabajo</div>
        <div class="nav-item" onclick="showView('v-presupuestos')">💰 Presupuesto Actual</div>
        <div class="nav-item" onclick="showView('v-precios')">📈 Base de Precios</div>
    </div>

    <div class="main-content">
        
        <!-- VISTA INICIO -->
        <div id="v-inicio" class="view active">
            <h1>Nueva Obra / Presupuesto</h1>
            <div class="input-box">
                <label>Nº REFERENCIA:</label>
                <input type="text" id="id_obra" placeholder="Ej: PRE-2024-001">
            </div>
        </div>

        <!-- VISTA MODULOS -->
        <div id="v-modulos" class="view">
            <h1>Configurador Técnico</h1>
            <div class="flex">
                <button onclick="loadSubMod('barandilla')" style="background:#f39c12;">🪜 Barandilla</button>
                <button onclick="loadSubMod('puerta')" style="background:#3b82f6;">🚪 Puerta</button>
            </div>
            <div id="sub-modulo-container" style="margin-top:20px;"></div>
        </div>

        <!-- VISTA PRESUPUESTO -->
        <div id="v-presupuestos" class="view">
            <h1>Resumen de Presupuesto</h1>
            <div id="contenido-presupuesto">No hay datos.</div>
        </div>

        <!-- VISTA PRECIOS -->
        <div id="v-precios" class="view">
            <h1>Lista de Materiales y Precios</h1>
            <div class="input-box">
                <table id="tabla-precios">
                    <thead><tr><th>Material (Nombre exacto para operario)</th><th>Precio (€/m o m2)</th></tr></thead>
                    <tbody id="lista-precios"></tbody>
                </table>
                <button onclick="nuevoMaterial()" style="margin-top:10px;">+ Añadir Material</button>
            </div>
        </div>

    </div>

<script>
    // CONFIGURACIÓN FIREBASE
    const firebaseConfig = {
        apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0",
        authDomain: "mstcalc.firebaseapp.com",
        projectId: "mstcalc",
        storageBucket: "mstcalc.firebasestorage.app",
        messagingSenderId: "68220801288",
        appId: "1:68220801288:web:cf0a033e03658c3f579cbd"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let presupuestoActual = { id: "", items: [] };
    // Estos precios se cargan y editan en la pestaña "Precios"
    let preciosDB = JSON.parse(localStorage.getItem('preciosMST')) || {
        "Tubo 40x40x2": 5.50,
        "Pletina 40x5": 3.20,
        "Barrote Redondo 14": 2.80,
        "Chapa Lisa 1.5mm": 25.00
    };

    function showView(id) {
        document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    // GESTIÓN DE PRECIOS
    function renderPrecios() {
        const tbody = document.getElementById('lista-precios');
        tbody.innerHTML = "";
        for (let m in preciosDB) {
            tbody.innerHTML += `<tr><td>${m}</td><td><input type="number" step="0.01" value="${preciosDB[m]}" onchange="actualizarPrecio('${m}', this.value)"> €</td></tr>`;
        }
    }
    function actualizarPrecio(m, v) { preciosDB[m] = parseFloat(v); localStorage.setItem('preciosMST', JSON.stringify(preciosDB)); }
    function nuevoMaterial() {
        let n = prompt("Nombre del material:");
        if(n) { preciosDB[n] = 0; renderPrecios(); }
    }

    // SELECTOR DINÁMICO DE MATERIALES
    function getSelectMateriales(id) {
        let select = `<select id="${id}"><option value="">-- Elige Material --</option>`;
        for(let m in preciosDB) { select += `<option value="${m}">${m}</option>`; }
        return select + `</select>`;
    }

    // MODULOS
    function loadSubMod(tipo) {
        const cont = document.getElementById('sub-modulo-container');
        const idObra = document.getElementById('id_obra').value;
        if(!idObra) return alert("Introduce el Nº de Obra");
        presupuestoActual.id = idObra;

        if(tipo === 'barandilla') {
            cont.innerHTML = `
                <div class="input-box" style="border-left: 5px solid #f39c12;">
                    <h3>📐 Configuración de Barandilla</h3>
                    <div class="flex">
                        <input type="number" id="l-total" placeholder="Longitud Total (mm)">
                        <input type="number" id="h-total" placeholder="Altura Total (mm)">
                    </div>
                    <div class="flex">
                        <label>Pasamanos:</label> ${getSelectMateriales('m-pasamano')}
                        <label>Base/Inferior:</label> ${getSelectMateriales('m-base')}
                    </div>
                    <div class="flex">
                        <label>Barrotes:</label> ${getSelectMateriales('m-barrote')}
                        <input type="number" id="sep" value="100" placeholder="Separación (mm)">
                    </div>
                    <div class="flex" style="background:#fff3cd; padding:10px; border-radius:8px;">
                        <input type="number" id="h-suelo" value="0" placeholder="Hueco al suelo (mm)">
                        <input type="number" id="h-pasamano" value="0" placeholder="Hueco al pasamano (mm)">
                    </div>
                    <button onclick="calcBarandilla()" style="background:#f39c12; width:100%;">CALCULAR DESPIECE</button>
                </div>`;
        }

        if(tipo === 'puerta') {
            cont.innerHTML = `
                <div class="input-box" style="border-left: 5px solid #3b82f6;">
                    <h3>🚪 Configuración de Puerta</h3>
                    <div class="flex">
                        <select id="p-tipo"><option value="batiente">Batiente</option><option value="autoportante">Autoportante</option></select>
                        <input type="number" id="p-w" placeholder="Ancho (mm)">
                        <input type="number" id="p-h" placeholder="Alto (mm)">
                    </div>
                    <div class="flex">
                        <label>Material Marco:</label> ${getSelectMateriales('m-marco')}
                        <label>Material Relleno:</label> ${getSelectMateriales('m-relleno')}
                    </div>
                    <button onclick="calcPuerta()" style="width:100%;">CALCULAR PUERTA</button>
                </div>`;
        }
    }

   // --- NUEVO MÓDULO DE COMPONENTES DE BARANDILLA ---
function loadSubMod(tipo) {
    const cont = document.getElementById('sub-modulo-container');
    const idObra = document.getElementById('id_obra').value;
    if(!idObra) return alert("Introduce el Nº de Obra");

    if(tipo === 'barandilla') {
        cont.innerHTML = `
            <div class="input-box" style="border-top: 5px solid #f39c12;">
                <h3>📐 Configurador por Componentes</h3>
                
                <div class="flex">
                    <input type="number" id="l-total" placeholder="Longitud Total (mm)">
                    <input type="number" id="h-total" placeholder="Altura Final (mm)">
                </div>

                <div style="background:#f8fafc; padding:15px; border-radius:10px; margin-bottom:15px;">
                    <h4>1. Estructura Principal</h4>
                    <div class="flex">
                        <label>Pasamanos:</label> ${getSelectMateriales('m-pasamano')}
                        <label>¿A pared?</label> <input type="checkbox" id="solo-pasamano" onchange="checkSoloPasamano()">
                    </div>
                    <div id="cont-estructura">
                        <div class="flex">
                            <label>¿Lleva Patas?</label> <input type="checkbox" id="lleva-patas" checked>
                            <label>Material Patas:</label> ${getSelectMateriales('m-patas')}
                            <input type="number" id="num-patas" value="2" title="Cantidad de patas" style="width:60px;">
                        </div>
                    </div>
                </div>

                <div id="cont-relleno" style="background:#fff7ed; padding:15px; border-radius:10px;">
                    <h4>2. Módulo de Relleno (Interior)</h4>
                    <p style="font-size:0.8rem; color:#9a3412;">Define las pletinas/tubos horizontales que encierran los barrotes</p>
                    <div class="flex">
                        <label>Material Guía (H):</label> ${getSelectMateriales('m-guia-h')}
                        <input type="number" id="h-suelo" value="100" title="Distancia al suelo" style="width:80px;">
                        <input type="number" id="h-techo" value="100" title="Distancia al pasamanos" style="width:80px;">
                    </div>
                    <div class="flex">
                        <label>Barrotes:</label> ${getSelectMateriales('m-barrote')}
                        <input type="number" id="sep" value="100" title="Separación">
                    </div>
                </div>

                <button onclick="calcBarandillaTecnica()" style="background:#f39c12; width:100%; margin-top:15px;">
                    GENERAR DESPIECE TÉCNICO
                </button>
            </div>`;
    }
}

function checkSoloPasamano() {
    const soloP = document.getElementById('solo-pasamano').checked;
    document.getElementById('cont-estructura').style.opacity = soloP ? "0.3" : "1";
    document.getElementById('cont-relleno').style.display = soloP ? "none" : "block";
}

function calcBarandillaTecnica() {
    const L = parseFloat(document.getElementById('l-total').value);
    const H = parseFloat(document.getElementById('h-total').value);
    const soloP = document.getElementById('solo-pasamano').checked;
    
    let despiece = [];
    let costeObra = 0;

    // 1. PASAMANOS (Siempre va)
    const matPas = document.getElementById('m-pasamano').value;
    if(matPas) {
        despiece.push({ mat: matPas, med: L, cant: 1, ang: "45/45" });
        costeObra += (L/1000) * preciosDB[matPas];
    }

    if(!soloP) {
        // 2. PATAS
        if(document.getElementById('lleva-patas').checked) {
            const matPatas = document.getElementById('m-patas').value;
            const nPatas = parseInt(document.getElementById('num-patas').value);
            despiece.push({ mat: matPatas, med: H, cant: nPatas, ang: "90/90" });
            costeObra += (H/1000) * nPatas * preciosDB[matPatas];
        }

        // 3. RELLENO (El módulo independiente que mencionas)
        const matGuia = document.getElementById('m-guia-h').value;
        const matBar = document.getElementById('m-barrote').value;
        const distSuelo = parseFloat(document.getElementById('h-suelo').value);
        const distTecho = parseFloat(document.getElementById('h-techo').value);
        const sep = parseFloat(document.getElementById('sep').value);

        if(matGuia && matBar) {
            // Dos guías horizontales (la de arriba y la de abajo del módulo)
            despiece.push({ mat: matGuia, med: L, cant: 2, ang: "90/90" });
            
            // Los barrotes van DENTRO de esas pletinas
            // El largo del barrote = Altura Total - Distancia Suelo - Distancia Techo
            const largoBar = H - distSuelo - distTecho;
            const nBar = Math.ceil(L / sep) - 1;
            
            despiece.push({ mat: matBar, med: largoBar, cant: nBar, ang: "90/90" });
            
            costeObra += (L*2/1000) * preciosDB[matGuia];
            costeObra += (largoBar*nBar/1000) * preciosDB[matBar];
        }
    }

    presupuestoActual.items.push({
        nombre: soloP ? "Pasamanos a pared" : "Barandilla Completa",
        piezas: despiece,
        precio: costeObra
    });
    
    renderPresupuesto();
}// --- NUEVO MÓDULO DE COMPONENTES DE BARANDILLA ---

    const idObra = document.getElementById('id_obra').value;
    if(!idObra) return alert("Introduce el Nº de Obra");

    if(tipo === 'barandilla') {
        cont.innerHTML = `
            <div class="input-box" style="border-top: 5px solid #f39c12;">

                    </div>
                    <div class="flex">
                        <label>Barrotes:</label> ${getSelectMateriales('m-barrote')}

                    </div>
                </div>

                <button onclick="calcBarandillaTecnica()" style="background:#f39c12; width:100%; margin-top:15px;">
                    GENERAR DESPIECE TÉCNICO
                </button>
            </div>`;
    }
}

        piezas: despiece,
        precio: costeObra
    });
    
    renderPresupuesto();
}

    function renderPresupuesto() {
        const div = document.getElementById('contenido-presupuesto');
        let html = `<table><tr><th>Obra: ${presupuestoActual.id}</th><th>Piezas</th><th>Precio Est.</th></tr>`;
        let total = 0;
        presupuestoActual.items.forEach((it, idx) => {
            html += `<tr><td>${it.nombre}</td><td>${it.piezas.length} tipos</td><td>${it.precio.toFixed(2)}€</td></tr>`;
            total += it.precio;
        });
        html += `</table><div class="resumen-total">TOTAL: ${total.toFixed(2)}€ <br><br> 
                 <button onclick="enviarTaller()" style="background:#22c55e;">✅ ENVIAR CORTES AL OPERARIO</button></div>`;
        div.innerHTML = html;
        showView('v-presupuestos');
    }

    function enviarTaller() {
        presupuestoActual.items.forEach(it => {
            it.piezas.forEach(p => {
                for(let i=0; i<p.cant; i++){
                    db.collection("materiales").add({
                        trabajo: presupuestoActual.id,
                        nombre: p.mat,
                        medida: p.med + "mm",
                        angulo: p.ang,
                        estado: "pendiente",
                        fecha: new Date()
                    });
                }
            });
        });
        alert("Cortes enviados con éxito.");
    }

    window.onload = renderPrecios;
</script>
</body>
</html>
