<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MSTCALC ADMIN PRO</title>
</head>

<body>

<h2>ADMIN</h2>

<input id="nombre" placeholder="Proyecto">
<input id="cliente" placeholder="Cliente">

<button onclick="guardar()">Guardar</button>

<pre id="out"></pre>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// TU CONFIG
const firebaseConfig = {
  apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0",
  authDomain: "mstcalc.firebaseapp.com",
  projectId: "mstcalc",
  storageBucket: "mstcalc.firebasestorage.app",
  messagingSenderId: "68220801288",
  appId: "1:68220801288:web:cf0a033e03658c3f579cbd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// PROYECTO
let proyectoActual = {
  nombre:"",
  cliente:"",
  tipo:"abatible",
  datos:{W:3000,H:2000,n:2},
  despiece:[
    {pieza:"Vertical",cantidad:4,largo:2000},
    {pieza:"Horizontal",cantidad:4,largo:1500}
  ]
};

// GUARDAR
async function guardar(){

  proyectoActual.nombre = nombre.value;
  proyectoActual.cliente = cliente.value;
  proyectoActual.fecha = new Date().toISOString();

  await addDoc(collection(db, "proyectos"), proyectoActual);

  out.textContent = "Guardado en Firebase 🔥";
}

</script>

</body>
</html>
