<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MSTCALC V47 - FORMATOS COMERCIALES Y CHAPAS</title>
    <style>
        :root { 
            --p: #0f172a; --s: #3b82f6; --bg: #f1f5f9; --success: #10b981; 
            --border: #cbd5e1; --sidebar-w: 280px;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); display: flex; color: #1e293b; min-height: 100vh; }
        
        .sidebar { width: var(--sidebar-w); background: var(--p); height: 100vh; color: white; padding: 25px; position: fixed; overflow-y: auto; border-right: 4px solid var(--s); z-index: 100; }
        .sidebar h2 { color: var(--s); font-size: 1.4rem; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .nav-group-title { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin: 25px 0 10px 0; font-weight: 900; letter-spacing: 1px; }
        .nav-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; color: #cbd5e1; font-size: 0.85rem; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: white; }
        .nav-item.active { background: var(--s); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        .main-content { margin-left: var(--sidebar-w); padding: 40px; width: calc(100% - var(--sidebar-w)); }
        .view { display: none; max-width: 1200px; margin: 0 auto; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }

        .card { background: white; padding: 25px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .flex { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .flex > div { flex: 1; min-width: 140px; }
        
        label { display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        input, select { padding: 10px; border: 2px solid #f1f5f9; border-radius: 8px; width: 100%; background: #f8fafc; font-size: 0.9rem; }
        
        .btn-add { background: var(--success); color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        
        /* TABLAS Y CATEGORÍAS */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; color: #64748b; font-size: 0.7rem; text-transform: uppercase; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 0.65rem; font-weight: 800; text-transform: uppercase; }
        .badge-perfil { background: #e0f2fe; color: #0369a1; }
        .badge-chapa { background: #fef3c7; color: #92400e; }

        .face-preview { background: #1e293b; border-radius: 8px; padding: 10px; color: white; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80px; margin-top: 5px; }
        .rect-box { border: 2px solid var(--s); position: relative; background: rgba(59, 130, 246, 0.1); }
        .label-dim { position: absolute; font-size: 9px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MSTCALC V47</h2>
        <div class="nav-item active" onclick="showView('v-datos', this)">📝 Datos Presupuesto</div>
        <div class="nav-group-title">Fabricación</div>
        <div class="nav-item" onclick="showView('v-puertas', this)">🚪 Puertas</div>
        <div class="nav-item" onclick="showView('v-prontuario', this)">📖 Prontuario Maestro</div>
        <div class="nav-group-title">Inventario</div>
        <div class="nav-item" onclick="showView('v-stock', this)">🏗️ Stock (Próximamente)</div>
    </div>

    <div class="main-content">
        <div id="v-datos" class="view active">
            <h1>📝 Proyecto Actual</h1>
            <div class="card"><div class="flex"><div style="flex: 2;"><label>Obra</label><input type="text" id="c-obra"></div><div><label>Fecha</label><input type="date" id="c-fecha"></div></div></div>
        </div>

        <div id="v-prontuario" class="view">
            <h1>📖 Prontuario Maestro</h1>
            
            <div class="card">
                <label style="margin-bottom: 15px; display: block; color: var(--s);">➕ REGISTRAR NUEVO MATERIAL</label>
                <div class="flex">
                    <div style="flex: 0.5;">
                        <label>Tipo</label>
                        <select id="new-tipo" onchange="toggleInputs()">
                            <option value="perfil">Perfil (Tubo/Lama)</option>
                            <option value="chapa">Chapa (Formato)</option>
                        </select>
                    </div>
                    <div><label>Nombre / Ref</label><input type="text" id="new-nom" placeholder="Ej: Chapa Lisa 2mm"></div>
                    <div><label id="label-a">Cara A / Ancho (mm)</label><input type="number" id="new-a"></div>
                    <div><label id="label-b">Cara B / Largo (mm)</label><input type="number" id="new-b"></div>
                    <div><label>Espesor (mm)</label><input type="number" id="new-e"></div>
                    <div><button class="btn-add" onclick="addMaterial()">Guardar</button></div>
                </div>
            </div>

            <div class="card">
                <table>
                    <thead><tr><th>Cat.</th><th>Referencia</th><th>Medidas Reales</th><th>Espesor</th><th>Acción</th></tr></thead>
                    <tbody id="tabla-body"></tbody>
                </table>
            </div>
        </div>

        <div id="v-puertas" class="view">
            <h1>🚪 Ingeniería de Puertas</h1>
            <div class="card">
                <div class="flex">
                    <div>
                        <label>Perfil Marco</label>
                        <select id="dr-mat-marco" onchange="calcPuerta()"></select>
                    </div>
                    <div>
                        <label>Previsualización Marco (A x B)</label>
                        <div class="face-preview" id="preview-marco"></div>
                    </div>
                    <div>
                        <label>Frente del Marco</label>
                        <select id="dr-ori-m" onchange="calcPuerta()">
                            <option value="a">Usar Cara A como frontal</option>
                            <option value="b">Usar Cara B como frontal</option>
                        </select>
                    </div>
                </div>
            </div>
            <div id="res-taller" class="card" style="background:#0f172a; color:white;"></div>
        </div>
    </div>

    <script>
        let prontuario = [
            { tipo: 'perfil', nom: "Tubo 80x40", a: 80, b: 40, e: 2 },
            { tipo: 'perfil', nom: "Tubo 100x40", a: 100, b: 40, e: 3 },
            { tipo: 'chapa', nom: "Formato Estándar", a: 1000, b: 2000, e: 2 },
            { tipo: 'chapa', nom: "Formato Grande", a: 1500, b: 3000, e: 3 }
        ];

        function toggleInputs() {
            const tipo = document.getElementById('new-tipo').value;
            document.getElementById('label-a').innerText = (tipo === 'perfil') ? 'Cara A (mm)' : 'Ancho (mm)';
            document.getElementById('label-b').innerText = (tipo === 'perfil') ? 'Cara B (mm)' : 'Largo (mm)';
        }

        function addMaterial() {
            const tipo = document.getElementById('new-tipo').value;
            const nom = document.getElementById('new-nom').value;
            const a = parseFloat(document.getElementById('new-a').value);
            const b = parseFloat(document.getElementById('new-b').value);
            const e = parseFloat(document.getElementById('new-e').value);

            if(nom && a && b) {
                prontuario.push({ tipo, nom, a, b, e });
                actualizarInterfaz();
                // Limpiar
                document.getElementById('new-nom').value = "";
                document.getElementById('new-a').value = "";
                document.getElementById('new-b').value = "";
                document.getElementById('new-e').value = "";
            }
        }

        function actualizarInterfaz() {
            // Tabla Prontuario
            document.getElementById('tabla-body').innerHTML = prontuario.map((m, i) => `
                <tr>
                    <td><span class="badge badge-${m.tipo}">${m.tipo}</span></td>
                    <td><strong>${m.nom}</strong></td>
                    <td>${m.a} x ${m.b} mm</td>
                    <td>${m.e} mm</td>
                    <td><button onclick="eliminar(${i})" style="border:none; background:none; cursor:pointer;">❌</button></td>
                </tr>
            `).join('');

            // Selectores (Solo perfiles para marcos de puerta)
            const selMarco = document.getElementById('dr-mat-marco');
            const perfiles = prontuario.filter(m => m.tipo === 'perfil');
            selMarco.innerHTML = perfiles.map((m, i) => `<option value="${i}">${m.nom}</option>`).join('');
            
            calcPuerta();
        }

        function calcPuerta() {
            const perfiles = prontuario.filter(m => m.tipo === 'perfil');
            const mat = perfiles[document.getElementById('dr-mat-marco').value];
            if(!mat) return;

            // Preview Visual
            const ori = document.getElementById('dr-ori-m').value;
            const width = 50;
            const height = width * (mat.b / mat.a);
            document.getElementById('preview-marco').innerHTML = `
                <div class="rect-box" style="width:${width}px; height:${height}px; border-width:${ori === 'a' ? '4px 1px' : '1px 4px'}">
                </div>
                <div style="font-size:10px; margin-top:5px;">A:${mat.a} x B:${mat.b}</div>
            `;

            document.getElementById('res-taller').innerHTML = `
                <h3 style="color:var(--s); margin-top:0;">📋 Despiece de Taller</h3>
                <p>Marco seleccionado: <strong>${mat.nom}</strong> (Espesor pared: ${mat.e}mm)</p>
                <p>Cara al frente: <strong>${ori === 'a' ? mat.a : mat.b} mm</strong></p>
            `;
        }

        function eliminar(i) {
            prontuario.splice(i, 1);
            actualizarInterfaz();
        }

        function showView(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        window.onload = () => {
            document.getElementById('c-fecha').valueAsDate = new Date();
            actualizarInterfaz();
        };
    </script>
</body>
</html>
