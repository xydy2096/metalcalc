<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>MSTCALC ADMIN PRO</title>
<style>
body{font-family:sans-serif;padding:20px;background:#f1f5f9}
.card{background:#fff;padding:20px;border-radius:10px;margin-bottom:20px}
</style>
</head>

<body>

<h2>ADMIN</h2>

<div class="card">
<input id="nombre" placeholder="Proyecto">
<input id="cliente" placeholder="Cliente">
</div>

<div class="card">
<h3>Abatible</h3>
<input id="w" type="number" value="3000">
<input id="h" type="number" value="2000">
<select id="nh">
<option value="1">1 hoja</option>
<option value="2">2 hojas</option>
</select>
<button onclick="calc()">Calcular</button>
</div>

<pre id="res"></pre>

<button onclick="guardar()">💾 Guardar en nube</button>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDzV1DaH14HMxoDRBHe_AvAmvaWDxWW4p0",
  authDomain: "mstcalc.firebaseapp.com",
  projectId: "mstcalc",
  storageBucket: "mstcalc.firebasestorage.app",
  messagingSenderId: "68220801288",
  appId: "1:68220801288:web:cf0a033e03658c3f579cbd"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let proyecto = {};

window.calc = function(){

let W=+w.value,H=+h.value,n=+nh.value;
let hoja=W/n;

let d=[
{pieza:"Vertical",cantidad:n*2,largo:H},
{pieza:"Horizontal",cantidad:n*2,largo:hoja}
];

proyecto = {
  nombre:nombre.value,
  cliente:cliente.value,
  tipo:"abatible",
  datos:{W,H,n},
  despiece:d,
  fecha:new Date().toISOString()
};

res.textContent = JSON.stringify(d,null,2);
}

window.guardar = async function(){
await addDoc(collection(db,"proyectos"), proyecto);
alert("Guardado 🔥");
}

</script>

</body>
</html>
