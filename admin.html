<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTCALC PRO</title>

<style>
:root { 
    --p:#0f172a; 
    --s:#3b82f6; 
    --bg:#f1f5f9; 
    --border:#cbd5e1; 
    --accent:#f59e0b;
}

*{box-sizing:border-box;font-family:Inter,sans-serif}

body{margin:0;display:flex;background:var(--bg);color:#1e293b}

/* SIDEBAR */
.sidebar{
    width:300px;
    background:var(--p);
    color:white;
    padding:20px;
    height:100vh;
    overflow-y:auto;
}

.sidebar h2{
    color:var(--s);
    text-align:center;
    margin-bottom:20px;
}

/* MENU */
.nav-item{
    padding:12px;
    border-radius:8px;
    cursor:pointer;
    margin-bottom:5px;
}

.nav-item:hover{background:#1e293b}
.nav-item.active{background:var(--s)}

.category-title{
    padding:10px;
    margin-top:10px;
    background:#1e293b;
    border-radius:8px;
    cursor:pointer;
    font-size:0.8rem;
    text-transform:uppercase;
}

.submenu{display:none;padding-left:10px}
.submenu.open{display:block}

/* MAIN */
.main{
    flex:1;
    padding:30px;
}

.view{display:none}
.view.active{display:block}

/* UI */
.card{
    background:white;
    padding:20px;
    border-radius:14px;
    margin-bottom:20px;
    box-shadow:0 4px 6px rgba(0,0,0,0.1);
}

.grid{
    display:grid;
    grid-template-columns:1fr 480px;
    gap:20px;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    border-radius:8px;
    border:1px solid #ddd;
}

/* RESULTADOS */
.res{
    background:#111827;
    color:#0f0;
    padding:15px;
    border-radius:10px;
    font-family:monospace;
    margin-top:10px;
}

/* CANVAS */
.canvas-box{
    background:#0f172a;
    padding:15px;
    border-radius:10px;
}

canvas{
    width:100%;
    background:#000;
}
</style>
</head>

<body>

<div class="sidebar">

<h2>MSTCALC</h2>

<div class="nav-item active" onclick="showView('v-datos',this)">📝 Proyecto</div>
<div class="nav-item" onclick="showView('v-historial',this)">📂 Historial</div>

<!-- TRABAJOS -->
<div class="category-title" onclick="toggle('trabajos')">🏗️ Trabajos</div>
<div id="trabajos" class="submenu open">

<div class="category-title" onclick="toggle('puertas')">🚪 Puertas</div>
<div id="puertas" class="submenu">
<div class="nav-item" onclick="showView('v-abatibles',this)">Abatibles</div>
<div class="nav-item" onclick="showView('v-correderas',this)">Correderas</div>
<div class="nav-item" onclick="showView('v-autoportantes',this)">Autoportantes</div>
</div>

<div class="category-title" onclick="toggle('estructuras')">🪜 Estructuras</div>
<div id="estructuras" class="submenu">
<div class="nav-item" onclick="showView('v-barandillas',this)">Barandillas</div>
<div class="nav-item" onclick="showView('v-vallas',this)">Vallas</div>
</div>

</div>

<!-- STOCK -->
<div class="category-title" onclick="toggle('stock')">📦 Stock</div>
<div id="stock" class="submenu">
<div class="nav-item" onclick="showView('v-stock',this)">Material</div>
<div class="nav-item" onclick="showView('v-stock-pintura',this)">🎨 Pinturas</div>
</div>

<!-- PRONTUARIO -->
<div class="category-title" onclick="toggle('prontuario')">📖 Prontuario</div>
<div id="prontuario" class="submenu">
<div class="nav-item" onclick="showView('v-prontuario',this)">Materiales</div>
<div class="nav-item" onclick="showView('v-prontuario-pintura',this)">🎨 Pinturas</div>
</div>

</div>

<div class="main">

<!-- PROYECTO -->
<div id="v-datos" class="view active">
<div class="card">
<h2>Proyecto</h2>
<input placeholder="Nombre obra">
<input placeholder="Cliente">
</div>
</div>

<!-- ABATIBLE -->
<div id="v-abatibles" class="view">
<div class="grid">
<div class="card">
<h3>Puerta Abatible</h3>
<input id="ab-w" type="number" value="3000" oninput="runAbatible()">
<input id="ab-h" type="number" value="2000" oninput="runAbatible()">
<select id="ab-n" onchange="runAbatible()">
<option value="1">1 hoja</option>
<option value="2">2 hojas</option>
</select>
</div>

<div class="canvas-box">
<canvas id="ab-canvas" width="500" height="350"></canvas>
<div id="ab-res" class="res"></div>
</div>
</div>
</div>

<!-- CORREDERA -->
<div id="v-correderas" class="view">
<div class="card">
<input id="co-w" value="4000" oninput="runCorredera()">
<input id="co-cola" value="400" oninput="runCorredera()">
<div id="co-res" class="res"></div>
</div>
</div>

<!-- AUTOPORTANTE -->
<div id="v-autoportantes" class="view">
<div class="card">
<input id="au-w" value="5000" oninput="runAuto()">
<div id="au-res" class="res"></div>
</div>
</div>

<!-- BARANDILLA -->
<div id="v-barandillas" class="view">
<div class="card">
<input id="ba-l" value="6000" oninput="runBarandilla()">
<input id="ba-h" value="1000" oninput="runBarandilla()">
<div id="ba-res" class="res"></div>
</div>
</div>

<!-- VALLAS -->
<div id="v-vallas" class="view">
<div class="card">
<input id="va-w" value="2000" oninput="runValla()">
<div id="va-res" class="res"></div>
</div>
</div>

<!-- STOCK -->
<div id="v-stock" class="view"><div class="card">Gestión de material</div></div>
<div id="v-stock-pintura" class="view"><div class="card">Gestión de pinturas</div></div>

<!-- PRONTUARIO -->
<div id="v-prontuario" class="view"><div class="card">Materiales</div></div>
<div id="v-prontuario-pintura" class="view"><div class="card">Pinturas</div></div>

<!-- HISTORIAL -->
<div id="v-historial" class="view"><div class="card">Historial</div></div>

</div>

<script>

function toggle(id){
document.getElementById(id).classList.toggle('open')
}

function showView(id,el){
document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'))
document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'))
document.getElementById(id).classList.add('active')
if(el) el.classList.add('active')
}

/* CALCULOS */

function runAbatible(){
let W=+ab-w.value,H=+ab-h.value,n=+ab-n.value
let hoja=W/n
ab-res.innerHTML=`Vertical: ${n*2} x ${H}mm<br>Horizontal: ${n*2} x ${hoja.toFixed(0)}mm`
dibujarAb(W,H,n)
}

function dibujarAb(W,H,n){
let ctx=document.getElementById("ab-canvas").getContext("2d")
ctx.clearRect(0,0,500,350)

ctx.strokeStyle="white"
ctx.strokeRect(50,50,400,250)

if(n==2){
ctx.beginPath()
ctx.moveTo(250,50)
ctx.lineTo(250,300)
ctx.stroke()
}
}

function runCorredera(){
let W=+co-w.value,cola=+co-cola.value
co-res.innerHTML=`Largueros: ${W+cola}mm`
}

function runAuto(){
let W=+au-w.value
let cp=W*0.35
au-res.innerHTML=`Contrapeso: ${cp.toFixed(0)}mm<br>Total guía: ${(W+cp).toFixed(0)}mm`
}

function runBarandilla(){
let L=+ba-l.value,H=+ba-h.value
ba-res.innerHTML=`Pasamanos: ${L}mm<br>Barrote: ${H-100}mm`
}

function runValla(){
let W=+va-w.value
va-res.innerHTML=`Tramo: ${W}mm`
}

runAbatible()
runCorredera()
runAuto()
runBarandilla()
runValla()

</script>

</body>
</html>
