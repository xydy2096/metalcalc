<div class="card" style="background: #f8f9fa; border-left: 8px solid #2c3e50;">
    <h2>📐 CALCULADORA TÉCNICA Y COMPRAS</h2>
    <div class="flex">
        <select id="tipo_mat" style="padding:10px; border-radius:5px;">
            <option value="Tubo 40x40x2" data-precio="4.50">Tubo 40x40x2 (4.50€/m)</option>
            <option value="Tubo 60x40x2" data-precio="5.80">Tubo 60x40x2 (5.80€/m)</option>
            <option value="Angular 30x3" data-precio="3.20">Angular 30x3 (3.20€/m)</option>
            <option value="Pasamano 40x5" data-precio="2.90">Pasamano 40x5 (2.90€/m)</option>
        </select>
        <input type="number" id="base" placeholder="Base (mm)" oninput="calcularTecnico()">
        <input type="number" id="altura" placeholder="Altura (mm)" oninput="calcularTecnico()">
        <button onclick="anadirALista()" style="background:#27ae60;">➕ Añadir a Obra</button>
    </div>

    <div id="pre-calculo" style="margin-top:15px; display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px;">
        <div style="background:white; padding:10px; border-radius:5px; border:1px solid #ddd;">
            <small>LONGITUD PIEZA</small><br><strong id="res-long">0</strong> mm
        </div>
        <div style="background:white; padding:10px; border-radius:5px; border:1px solid #ddd;">
            <small>ÁNGULO CORTE</small><br><strong id="res-ang">0</strong>°
        </div>
        <div style="background:white; padding:10px; border-radius:5px; border:1px solid #ddd;">
            <small>PRECIO PIEZA</small><br><strong id="res-coste">0</strong> €
        </div>
    </div>
</div>

<div class="card" style="background: #2c3e50; color: white;">
    <h3>💰 RESUMEN DE PEDIDO (Barras de 6m)</h3>
    <div id="resumen-pedido">Añade materiales para calcular barras...</div>
    <hr>
    <h3 id="total-presupuesto">Total Presupuesto: 0.00 €</h3>
</div>

<script>
// --- LÓGICA DE CÁLCULO ---
let listaTemporal = []; // Para guardar lo que vamos sumando antes de enviar a Firebase

function calcularTecnico() {
    const b = parseFloat(document.getElementById('base').value) || 0;
    const h = parseFloat(document.getElementById('altura').value) || 0;
    const select = document.getElementById('tipo_mat');
    const precioM = parseFloat(select.options[select.selectedIndex].dataset.precio);

    if (b > 0 && h > 0) {
        const long = Math.sqrt(Math.pow(b, 2) + Math.pow(h, 2));
        const ang = (Math.atan(h / b) * (180 / Math.PI)).toFixed(1);
        
        document.getElementById('res-long').innerText = long.toFixed(0);
        document.getElementById('res-ang').innerText = ang;
        document.getElementById('res-coste').innerText = ((long / 1000) * precioM).toFixed(2);
    }
}

function anadirALista() {
    const idT = document.getElementById('diseno_id').value; // Usamos el ID de trabajo que tengas puesto
    if(!idT) { alert("Pon primero el Nº de Trabajo arriba"); return; }

    const select = document.getElementById('tipo_mat');
    const material = select.value;
    const precioM = parseFloat(select.options[select.selectedIndex].dataset.precio);
    const long = parseFloat(document.getElementById('res-long').innerText);
    const angulo = document.getElementById('res-ang').innerText + "°";

    // Guardar en Firebase para el operario
    db.collection("materiales").add({
        trabajo: idT,
        nombre: material,
        medida: long.toFixed(0) + "mm",
        angulo: angulo,
        estado: 'pendiente',
        precio: ((long / 1000) * precioM),
        fecha: new Date()
    });

    actualizarPresupuestoGlobal(material, long, precioM);
}

function actualizarPresupuestoGlobal(mat, long, precioM) {
    // Buscamos si el material ya existe en nuestra suma
    let item = listaTemporal.find(i => i.nombre === mat);
    if(item) {
        item.totalLong += long;
    } else {
        listaTemporal.push({ nombre: mat, totalLong: long, precioM: precioM });
    }

    let html = "<ul>";
    let granTotal = 0;

    listaTemporal.forEach(i => {
        const barras = Math.ceil(i.totalLong / 6000); // Dividimos por 6 metros
        const costeMat = i.totalLong / 1000 * i.precioM;
        granTotal += costeMat;
        html += `<li><b>${i.nombre}</b>: ${(i.totalLong/1000).toFixed(2)}m -> <strong>Comprar ${barras} barras</strong> (${costeMat.toFixed(2)}€)</li>`;
    });

    html += "</ul>";
    document.getElementById('resumen-pedido').innerHTML = html;
    document.getElementById('total-presupuesto').innerText = "Total Presupuesto: " + granTotal.toFixed(2) + " €";
}
</script>
