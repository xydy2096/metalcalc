<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>MSTCALC V42 - SISTEMA INTEGRAL UNIFICADO</title>
    <style>
        :root { 
            --p: #0f172a; --s: #3b82f6; --bg: #f1f5f9; --success: #10b981; 
            --border: #cbd5e1; --sidebar-w: 280px;
        }
        body { font-family: 'Inter', sans-serif; margin: 0; background: var(--bg); display: flex; color: #1e293b; min-height: 100vh; }
        
        /* SIDEBAR */
        .sidebar { width: var(--sidebar-w); background: var(--p); height: 100vh; color: white; padding: 25px; position: fixed; overflow-y: auto; border-right: 4px solid var(--s); z-index: 100; }
        .sidebar h2 { color: var(--s); font-size: 1.4rem; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 20px; text-align: center; }
        .nav-group-title { font-size: 0.7rem; color: #64748b; text-transform: uppercase; margin: 25px 0 10px 0; font-weight: 900; letter-spacing: 1px; }
        .nav-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 10px; color: #cbd5e1; font-size: 0.85rem; }
        .nav-item:hover { background: rgba(59, 130, 246, 0.1); color: white; }
        .nav-item.active { background: var(--s); color: white; font-weight: 600; box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3); }

        /* CONTENIDO */
        .main-content { margin-left: var(--sidebar-w); padding: 40px; width: calc(100% - var(--sidebar-w)); }
        .view { display: none; max-width: 1100px; margin: 0 auto; }
        .view.active { display: block; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .card { background: white; padding: 25px; border-radius: 15px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .flex { display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end; }
        .flex > div { flex: 1; min-width: 140px; }
        
        label { display: block; font-size: 0.75rem; font-weight: 800; color: #64748b; margin-bottom: 8px; text-transform: uppercase; }
        input, select, textarea { padding: 10px; border: 2px solid #f1f5f9; border-radius: 8px; width: 100%; background: #f8fafc; font-size: 0.9rem; }
        
        .result-box { background: #0f172a; color: #f8fafc; padding: 20px; border-radius: 12px; font-family: 'Consolas', monospace; margin-top: 15px; border-left: 5px solid var(--s); }
        .corte-item { background: #1e293b; padding: 15px; border-radius: 8px; border: 1px solid #334155; margin-bottom: 10px; color: #e2e8f0; }
        .val { color: var(--success); font-weight: bold; }
        
        canvas { background: #0f172a; border-radius: 12px; width: 100%; height: auto; border: 1px solid #334155; }
        .faldamiento-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .locked { display: none; } /* Para ocultar opciones desiguales si no es 2 hojas */

        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>MSTCALC V42</h2>
        <div class="nav-item active" onclick="showView('v-datos', this)">📝 Datos Presupuesto</div>
        <div class="nav-group-title">Fabricación</div>
        <div class="nav-item" onclick="showView('v-puertas', this)">🚪 Puertas</div>
        <div class="nav-item" onclick="showView('v-barandillas', this)">🪜 Barandillas</div>
        <div class="nav-item" onclick="showView('v-chapa', this)">✂️ Optimizador Chapa</div>
        <div class="nav-group-title">Suministros</div>
        <div class="nav-item" onclick="showView('v-prontuario', this)">📖 Prontuario</div>
        <div class="nav-item" onclick="showView('v-stock', this)">🏗️ Stock</div>
        <div class="nav-group-title">Finanzas</div>
        <div class="nav-item" onclick="showView('v-presupuesto', this)">🧾 Presupuesto</div>
        <div class="nav-item" onclick="showView('v-errores', this)">⚠️ Errores</div>
    </div>

    <div class="main-content">
        <div id="v-datos" class="view active">
            <h1>📝 Datos del Presupuesto</h1>
            <div class="card"><div class="flex"><div style="flex: 2;"><label>Cliente</label><input type="text" id="c-obra"></div><div><label>Fecha</label><input type="date" id="c-fecha"></div></div></div>
        </div>

        <div id="v-puertas" class="view">
            <h1>🚪 Ingeniería de Puertas</h1>
            <div class="card">
                <div class="flex">
                    <div>
                        <label>Tipo Apertura</label>
                        <select id="dr-tipo" onchange="toggleFaldamientos(); calcPuerta();">
                            <option value="abatible">Abatible (1 Hoja)</option>
                            <option value="abatible2" selected>Abatible (2 Hojas)</option>
                            <option value="corredera">Corredera</option>
                            <option value="autoportante">Autoportante</option>
                        </select>
                    </div>
                    <div><label>Perfil Marco</label><select id="dr-mat-marco" onchange="calcPuerta()"></select></div>
                    <div><label>Posición Marco</label><select id="dr-ori-m" onchange="calcPuerta()"><option value="a">Cara A frente</option><option value="b">Cara B frente</option></select></div>
                </div>
                
                <div class="flex" style="margin-top:20px;">
                    <div><label>Ancho Hueco (W)</label><input type="number" id="dr-w" value="2000" oninput="calcPuerta()"></div>
                    <div><label>Alto Hueco (H)</label><input type="number" id="dr-h" value="2100" oninput="calcPuerta()"></div>
                    <div><label>Perfil Hoja</label><select id="dr-mat-hoja" onchange="calcPuerta()"></select></div>
                </div>

                <div id="desigual-container" style="margin-top:20px; display:none; border-top:1px solid #eee; padding-top:15px;">
                    <div class="flex">
                        <div>
                            <label>Configuración Hojas</label>
                            <select id="dr-hojas-modo" onchange="calcPuerta()">
                                <option value="iguales">Hojas Iguales</option>
                                <option value="desiguales">Hojas Desiguales</option>
                            </select>
                        </div>
                        <div id="w-hoja1-box" style="visibility:hidden;">
                            <label>Ancho Hoja 1 (mm)</label>
                            <input type="number" id="dr-w-h1" value="1200" oninput="calcPuerta()">
                        </div>
                    </div>
                </div>

                <div id="faldamientos-container" style="margin-top:20px;">
                    <label>Faldamientos / Solapes (mm)</label>
                    <div class="faldamiento-grid">
                        <div><label>Sup</label><input type="number" id="f-sup" value="20" oninput="calcPuerta()"></div>
                        <div><label>Inf</label><input type="number" id="f-inf" value="0" oninput="calcPuerta()"></div>
                        <div><label>Izq</label><input type="number" id="f-izq" value="20" oninput="calcPuerta()"></div>
                        <div><label>Der</label><input type="number" id="f-der" value="20" oninput="calcPuerta()"></div>
                    </div>
                </div>
            </div>

            <div class="card" style="background: #0f172a; text-align: center;"><canvas id="dr-canvas" width="600" height="400"></canvas></div>
            <div id="dr-despiece" class="grid-taller"></div>
            <div class="result-box" id="dr-final"></div>
        </div>

        <div id="v-prontuario" class="view">
            <h1>📖 Prontuario</h1>
            <div class="card"><table id="tabla-p"><thead><tr><th>Perfil</th><th>A</th><th>B</th></tr></thead><tbody id="lista-materiales"></tbody></table></div>
        </div>
        
        <div id="v-barandillas" class="view"><h1>🪜 Barandillas</h1></div>
        <div id="v-chapa" class="view"><h1>✂️ Optimizador</h1></div>
        <div id="v-stock" class="view"><h1>🏗️ Stock</h1></div>
        <div id="v-presupuesto" class="view"><h1>🧾 Finanzas</h1></div>
        <div id="v-errores" class="view"><h1>⚠️ Errores</h1></div>
    </div>

    <script>
        let prontuario = [
            { nombre: "80x40x2", a: 80, b: 40 },
            { nombre: "60x40x1.5", a: 60, b: 40 },
            { nombre: "40x40x1.5", a: 40, b: 40 }
        ];

        function actualizarSelects() {
            const opt = prontuario.map((m, i) => `<option value="${i}">${m.nombre}</option>`).join('');
            document.getElementById('dr-mat-marco').innerHTML = opt;
            document.getElementById('dr-mat-hoja').innerHTML = opt;
            document.getElementById('lista-materiales').innerHTML = prontuario.map(m => `<tr><td>${m.nombre}</td><td>${m.a}mm</td><td>${m.b}mm</td></tr>`).join('');
        }

        function toggleFaldamientos() {
            const tipo = document.getElementById('dr-tipo').value;
            document.getElementById('faldamientos-container').style.opacity = (tipo.includes('abatible')) ? '1' : '0.3';
            document.getElementById('desigual-container').style.display = (tipo === 'abatible2') ? 'block' : 'none';
        }

        function showView(id, el) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            if(id === 'v-puertas') calcPuerta();
        }

        function calcPuerta() {
            const tipo = document.getElementById('dr-tipo').value;
            const pMarco = prontuario[document.getElementById('dr-mat-marco').value];
            const pHoja = prontuario[document.getElementById('dr-mat-hoja').value];
            const ori = document.getElementById('dr-ori-m').value;
            const eM = (ori === 'a') ? pMarco.a : pMarco.b;
            
            const W = parseFloat(document.getElementById('dr-w').value) || 0;
            const H = parseFloat(document.getElementById('dr-h').value) || 0;
            const fSup = parseFloat(document.getElementById('f-sup').value) || 0;
            const fInf = parseFloat(document.getElementById('f-inf').value) || 0;
            const fIzq = parseFloat(document.getElementById('f-izq').value) || 0;
            const fDer = parseFloat(document.getElementById('f-der').value) || 0;

            const nH = (tipo === "abatible2") ? 2 : 1;
            const modoHojas = document.getElementById('dr-hojas-modo').value;
            document.getElementById('w-hoja1-box').style.visibility = (modoHojas === 'desiguales' && nH === 2) ? 'visible' : 'hidden';

            let hW1, hW2, hH, des = "";

            if (tipo.includes("abatible")) {
                const aireTotal = 15; // Holgura total entre marcos y hojas
                const anchoLibreTotal = W - (eM * 2) - aireTotal;
                hH = (H - eM - 15) + fSup + fInf;

                if (tipo === "abatible2" && modoHojas === "desiguales") {
                    hW1 = parseFloat(document.getElementById('dr-w-h1').value) || (anchoLibreTotal/2);
                    hW2 = anchoLibreTotal - hW1 + fIzq + fDer; // Ajuste simplificado
                    // Ajuste técnico: La suma de hojas + solapes
                    hW1 = hW1 + fIzq;
                    hW2 = (anchoLibreTotal - (hW1 - fIzq)) + fDer;
                } else {
                    hW1 = (anchoLibreTotal / nH) + (fIzq / nH) + (fDer / nH);
                    hW2 = hW1;
                }

                des = `
                    <div class="corte-item"><label>MARCO U</label>• 2x ${H}mm | • 1x ${W}mm</div>
                    <div class="corte-item"><label>HOJA 1</label>• 2x ${hH.toFixed(0)}mm | • 2x ${hW1.toFixed(0)}mm</div>
                `;
                if(nH === 2) des += `<div class="corte-item"><label>HOJA 2</label>• 2x ${hH.toFixed(0)}mm | • 2x ${hW2.toFixed(0)}mm</div>`;
                
                document.getElementById('dr-final').innerHTML = `<strong>H1:</strong> ${hW1.toFixed(0)}x${hH.toFixed(0)} | <strong>H2:</strong> ${hW2.toFixed(0)}x${hH.toFixed(0)}`;
                dibujarPuerta(W, H, eM, hW1, hW2, hH, nH);
            }
            document.getElementById('dr-despiece').innerHTML = des;
        }

        function dibujarPuerta(W, H, eM, hW1, hW2, hH, nH) {
            const cv = document.getElementById('dr-canvas');
            const ctx = cv.getContext('2d');
            ctx.clearRect(0,0,600,400);
            const sc = Math.min(500/W, 300/H);
            const ox = (600 - W*sc)/2; const oy = 40;

            // Marco
            ctx.strokeStyle = "#64748b"; ctx.lineWidth = eM*sc; ctx.beginPath();
            ctx.moveTo(ox + (eM*sc)/2, oy+H*sc); ctx.lineTo(ox + (eM*sc)/2, oy+(eM*sc)/2);
            ctx.lineTo(ox + W*sc - (eM*sc)/2, oy+(eM*sc)/2); ctx.lineTo(ox + W*sc - (eM*sc)/2, oy+H*sc);
            ctx.stroke();

            // Hojas
            ctx.strokeStyle = "#3b82f6"; ctx.lineWidth = 2;
            ctx.strokeRect(ox + (eM*sc) + 2, oy + (eM*sc) + 2, hW1*sc, hH*sc);
            if(nH === 2) ctx.strokeRect(ox + W*sc - (eM*sc) - (hW2*sc) - 2, oy + (eM*sc) + 2, hW2*sc, hH*sc);
        }

        window.onload = () => { actualizarSelects(); document.getElementById('c-fecha').valueAsDate = new Date(); toggleFaldamientos(); calcPuerta(); };
    </script>
</body>
</html>
