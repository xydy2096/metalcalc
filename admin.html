<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSTCALC PRO</title>

<style>
:root { 
    --p:#0f172a; --s:#3b82f6; --bg:#f1f5f9;
    --border:#cbd5e1; --card:#fff; --danger:#ef4444;
}
body{margin:0;display:flex;background:var(--bg);font-family:sans-serif}
.sidebar{width:260px;background:var(--p);color:#fff;padding:20px}
.nav-item{padding:10px;cursor:pointer;border-radius:8px}
.nav-item:hover{background:#1e293b}
.nav-item.active{background:var(--s)}
.main{flex:1;padding:30px}
.view{display:none}
.view.active{display:block}
.card{background:#fff;padding:20px;border-radius:12px;margin-bottom:20px}
input,select{width:100%;padding:10px;margin-top:5px}
button{padding:10px;margin-top:10px;cursor:pointer}
.res{background:#111;color:#0f0;padding:15px;font-family:monospace}
</style>
</head>

<body>

<div class="sidebar">
    <h2>MSTCALC</h2>
    <div class="nav-item active" onclick="show('datos',this)">Proyecto</div>
    <div class="nav-item" onclick="show('abatible',this)">Abatible</div>
    <div class="nav-item" onclick="show('historial',this)">Historial</div>
</div>

<div class="main">

<!-- PROYECTO -->
<div id="datos" class="view active">
<div class="card">
<h3>Proyecto</h3>
<input id="nombre" placeholder="Nombre">
<input id="cliente" placeholder="Cliente">
<select id="estado">
<option value="pendiente">Pendiente</option>
<option value="aceptado">Aceptado</option>
</select>
<button onclick="guardar()">💾 Guardar Proyecto</button>
</div>
</div>

<!-- ABATIBLE -->
<div id="abatible" class="view">
<div class="card">
<h3>Puerta Abatible</h3>
<input type="number" id="w" value="3000" oninput="calcAb()">
<input type="number" id="h" value="2000" oninput="calcAb()">
<select id="nh" onchange="calcAb()">
<option value="1">1 hoja</option>
<option value="2">2 hojas</option>
</select>
</div>

<div class="res" id="res"></div>
</div>

<!-- HISTORIAL -->
<div id="historial" class="view">
<div class="card">
<h3>Historial</h3>
<div id="lista"></div>
</div>
</div>

</div>

<script>

// --- BASE DATOS ---
let historial = JSON.parse(localStorage.getItem('hist')) || [];

// --- PROYECTO ACTIVO ---
let proyectoActual = {
    nombre:"",
    cliente:"",
    estado:"pendiente",
    tipo:"",
    datos:{},
    despiece:[]
};

// --- NAVEGACIÓN ---
function show(id,el){
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    el.classList.add('active');
    renderHist();
}

// --- CALCULO ABATIBLE ---
function calcAb(){
    const W = parseFloat(w.value);
    const H = parseFloat(h.value);
    const nH = parseInt(nh.value);

    const hoja = W / nH;

    const despiece = [
        {pieza:"Vertical", cantidad:nH*2, largo:H},
        {pieza:"Horizontal", cantidad:nH*2, largo:hoja}
    ];

    // guardar en proyecto
    proyectoActual.tipo = "abatible";
    proyectoActual.datos = {W,H,nH};
    proyectoActual.despiece = despiece;

    // pintar
    res.innerHTML = despiece.map(p =>
        `${p.pieza} → ${p.cantidad} uds x ${p.largo.toFixed(0)}mm`
    ).join("<br>");
}

// --- GUARDAR ---
function guardar(){
    proyectoActual.nombre = nombre.value;
    proyectoActual.cliente = cliente.value;
    proyectoActual.estado = estado.value;
    proyectoActual.fecha = new Date().toLocaleDateString();

    historial.push({...proyectoActual});
    localStorage.setItem('hist', JSON.stringify(historial));

    alert("Guardado completo");
}

// --- HISTORIAL ---
function renderHist(){
    lista.innerHTML = historial.map(p => `
        <div style="border-bottom:1px solid #ccc;margin-bottom:10px">
            <b>${p.nombre}</b> (${p.tipo})<br>
            ${p.cliente} - ${p.estado}<br>
            <small>${p.fecha}</small>
        </div>
    `).join('');
}

// INIT
calcAb();
renderHist();

</script>

</body>
</html>
